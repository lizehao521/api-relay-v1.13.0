<!doctype html>
<html lang="zh-CN" data-theme="dark" data-density="compact" data-role="owner">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>api-relay · 聚合中转模型 API 平台 — 高保真原型 v1.0</title>
<!--
  api-relay 二次开发 · 阶段3 高保真原型（单文件 · hash 切页 · 零 CDN · 双击离线可开）
  设计系统：Linear 基因 + 沿用 GitHub 暗色色值 · v1.0  —— 来源 design-proto/02-design-system.md
  规格依据：design-proto/03-prototype-spec.md（页面/交互/状态/权限/计费/密钥路由/监控日志/验收）
  所有色值/尺寸/圆角/阴影均取自 02 文档的 CSS 自定义属性（--c-*/--fs-*/--sp-*/--r-*/--sh-*/--z-*）。
  图标一律文本符号，无图标字体、无外部资源。
-->
<style>
/* ============================================================
   ① 设计令牌 —— 逐字取自 02-design-system.md（暗色默认 + 亮色映射 + 双密度）
   ============================================================ */
:root{
  /* surface */
  --c-bg:#0d1117; --c-surface-1:#161b22; --c-surface-2:#1b212a; --c-surface-3:#21262d;
  --c-surface-code:#0b0f14; --c-surface-hover:#2a313a; --c-border:#30363d; --c-border-subtle:#222831; --c-border-hover:#3d444d;
  /* fg */
  --c-fg:#e6edf3; --c-fg-muted:#8b949e; --c-fg-subtle:#6e7681; --c-fg-invert:#ffffff;
  /* accent */
  --c-accent:#58a6ff; --c-accent-strong:#1f6feb; --c-accent-strong-hover:#2a7ff5; --c-focus-ring:rgba(88,166,255,.45); --c-login-glow:#16273d;
  /* semantic */
  --c-ok:#3fb950; --c-warn:#d29922; --c-danger:#f85149; --c-info:#58a6ff; --c-neutral:#7d8590; --c-purple:#bc8cff; --c-agent:#bc8cff;
  /* upstream */
  --c-upstream-ok:#3fb950; --c-upstream-degraded:#d29922; --c-upstream-halfopen:#bc8cff; --c-upstream-open:#f85149; --c-upstream-disabled:#6e7681; --c-upstream-limit:#d29922;
  /* tier */
  --c-tier-free:#7d8590; --c-tier-free-bg:rgba(125,133,144,.12); --c-tier-free-border:#424851;
  --c-tier-standard:#58a6ff; --c-tier-standard-bg:rgba(88,166,255,.12); --c-tier-standard-border:#1f6feb;
  --c-tier-pro:#a371f7; --c-tier-pro-bg:rgba(163,113,247,.14); --c-tier-pro-border:#8957e5;
  /* border aux */
  --c-ok-border:#2b6a35; --c-warn-border:#5c4a12; --c-danger-border:#6e2b28; --c-info-border:#1f6feb; --c-danger-note-border:#5c2a12;
  --c-ok-bg:rgba(63,185,80,.12); --c-warn-bg:rgba(210,153,34,.12); --c-danger-bg:rgba(248,81,73,.12); --c-info-bg:rgba(31,111,235,.12);
  /* type */
  --font-sans:system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
  --font-mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono","Courier New",monospace; --font-num:var(--font-mono);
  --fs-2xs:10px; --fs-xs:11px; --fs-sm:12px; --fs-md:13px; --fs-base:14px; --fs-lg:15px; --fs-xl:17px; --fs-2xl:23px; --fs-3xl:28px;
  --lh-tight:1.25; --lh-snug:1.45; --lh-base:1.6; --lh-relaxed:1.65;
  --fw-regular:400; --fw-medium:500; --fw-semibold:600; --fw-bold:700; --fw-kpi:650; --ls-tight:-.02em; --ls-label:.06em; --ls-group:.09em;
  /* space */
  --sp-0:0; --sp-1:4px; --sp-2:8px; --sp-2h:10px; --sp-3:12px; --sp-4:16px; --sp-5:22px; --sp-6:28px; --sp-7:32px; --sp-8:40px; --sp-9:80px;
  /* radius */
  --r-sm:4px; --r-1:6px; --r-2:10px; --r-3:14px; --r-full:999px;
  /* shadow */
  --sh-1:0 1px 2px rgba(0,0,0,.35); --sh-2:0 10px 30px rgba(0,0,0,.45); --sh-drawer:-18px 0 44px rgba(0,0,0,.5); --sh-focus:0 0 0 3px var(--c-focus-ring);
  /* z */
  --z-base:0; --z-topbar:30; --z-scrim:55; --z-drawer:60; --z-navscrim:65; --z-nav:70; --z-login:80; --z-toast:90; --z-tooltip:100;
  /* motion */
  --dur-instant:80ms; --dur-fast:120ms; --dur-base:180ms; --dur-slow:220ms; --dur-sheen:1400ms; --dur-bar:200ms;
  --ease-standard:cubic-bezier(.22,.61,.36,1); --ease-out:cubic-bezier(0,0,.2,1); --ease-in-out:cubic-bezier(.4,0,.2,1);
  /* layout */
  --layout-nav-w:232px; --layout-topbar-h:52px; --layout-nav-w-narrow:min(272px,84vw); --layout-max:1200px; --layout-gutter:var(--sp-5); --grid-gap:var(--sp-3);
  --grid-cards-4:repeat(4,minmax(0,1fr)); --grid-cards-2:repeat(2,minmax(0,1fr)); --grid-two:1.3fr 1fr;
  /* density (default compact) */
  --density-row-h:36px; --density-cell-pad-y:11px; --density-cell-pad-x:var(--sp-3); --density-card-pad:var(--sp-4);
  --density-main-pad:var(--sp-5) var(--sp-5) var(--sp-9); --density-control-h:30px; --density-gap:var(--sp-3);
}
:root[data-theme="light"]{
  --c-bg:#f6f8fa; --c-surface-1:#ffffff; --c-surface-2:#f0f2f5; --c-surface-3:#eaeef2; --c-surface-code:#f6f8fa; --c-surface-hover:#eaeef2;
  --c-border:#d0d7de; --c-border-subtle:#e5e8eb; --c-border-hover:#b7bec6;
  --c-fg:#1f2328; --c-fg-muted:#59636e; --c-fg-subtle:#818b98; --c-fg-invert:#ffffff;
  --c-accent:#0969da; --c-accent-strong:#0969da; --c-accent-strong-hover:#0a5fc0; --c-focus-ring:rgba(9,105,218,.35); --c-login-glow:#dbeafe;
  --c-ok:#1a7f37; --c-warn:#9a6700; --c-danger:#d1242f; --c-info:#0969da; --c-neutral:#59636e; --c-purple:#8250df; --c-agent:#8250df;
  --c-upstream-ok:#1a7f37; --c-upstream-degraded:#9a6700; --c-upstream-halfopen:#8250df; --c-upstream-open:#d1242f; --c-upstream-disabled:#818b98;
  --c-tier-free:#59636e; --c-tier-standard:#0969da; --c-tier-pro:#8250df;
  --sh-1:0 1px 2px rgba(0,0,0,.08); --sh-2:0 10px 30px rgba(0,0,0,.12); --sh-drawer:-18px 0 44px rgba(0,0,0,.18);
}
:root[data-density="cozy"]{
  --density-row-h:44px; --density-cell-pad-y:14px; --density-cell-pad-x:var(--sp-4); --density-card-pad:var(--sp-5);
  --density-main-pad:var(--sp-6) var(--sp-4) var(--sp-9); --density-control-h:42px; --density-gap:var(--sp-4);
}
/* 旧变量别名（零侵入迁移，02 §2.2） */
:root{ --bg:var(--c-bg); --panel:var(--c-surface-1); --panel2:var(--c-surface-2); --chip:var(--c-surface-3);
  --fg:var(--c-fg); --dim:var(--c-fg-muted); --accent:var(--c-accent); --ok:var(--c-ok); --warn:var(--c-warn); --err:var(--c-danger); --pur:var(--c-purple);
  --s1:var(--sp-1); --s2:var(--sp-2); --s3:var(--sp-3); --s4:var(--sp-4); --s5:var(--sp-5); --r1:var(--r-1); --r2:var(--r-2); --r3:var(--r-3);
  --mono:var(--font-mono); --focus:var(--c-focus-ring); --nav-w:var(--layout-nav-w); --topbar-h:var(--layout-topbar-h); }

/* 组件级 / 布局级令牌（P1-1 修复：逐条取自 02 §5.1–§5.10、§6.1–§6.2，消除写死值） */
:root{
  /* 按钮 §5.1 */
  --btn-h-sm:26px; --btn-h-md:var(--density-control-h); --btn-pad-x:10px; --btn-radius:var(--r-1); --btn-gap:var(--sp-1);
  --btn-primary-bg:var(--c-accent-strong); --btn-primary-bg-hover:var(--c-accent-strong-hover); --btn-primary-fg:var(--c-fg-invert);
  --btn-danger-border:var(--c-danger-border); --btn-danger-fg:#ff9d96; --btn-danger-bg-hover:#3d1d1b; --btn-disabled-opacity:.45;
  /* 输入 §5.2 */
  --input-h:var(--density-control-h); --input-bg:var(--c-surface-3); --input-border:var(--c-border); --input-border-hover:var(--c-border-hover);
  --input-border-focus:var(--c-accent); --input-radius:var(--r-1); --input-pad:6px 10px; --input-focus-ring:0 0 0 3px var(--c-focus-ring);
  /* 抽屉 §5.4 */
  --drawer-w:min(580px,94vw); --drawer-w-narrow:min(440px,94vw); --drawer-head-pad:14px var(--sp-4);
  --drawer-body-pad:var(--sp-4); --drawer-foot-pad:var(--sp-3) var(--sp-4); --scrim-bg:rgba(0,0,0,.55);
  /* 卡片 §5.5 */
  --card-radius:var(--r-2); --card-hover-border:var(--c-border-hover);
  /* 徽标 §5.6 */
  --chip-radius:var(--r-full); --chip-pad:1px 9px; --chip-dot-size:6px;
  /* 进度 §5.7 */
  --bar-h-inline:5px; --bar-h-block:8px;
  /* Toast §5.8 */
  --toast-max-w:560px; --toast-pad:10px 15px; --toast-left-w:3px;
  /* 空态 §5.9 */
  --empty-pad:var(--sp-5); --empty-icon-size:22px; --empty-font-size:var(--fs-md);
  /* 骨架 §5.10 */
  --skel-h:14px; --skel-radius:var(--r-1);
  /* 顶栏 §6.1 */
  --topbar-pad:10px var(--sp-5); --topbar-blur:blur(8px); --topbar-bg:color-mix(in srgb, var(--c-surface-1) 88%, transparent);
  /* 导航项 §6.2 */
  --nav-item-h:34px; --nav-item-pad:7px var(--sp-4) 7px 13px; --nav-item-radius:var(--r-1); --nav-item-indicator-w:3px;
}

/* ============================================================
   ② 基础
   ============================================================ */
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--font-sans); font-size:var(--fs-base); line-height:var(--lh-base);
  color:var(--c-fg); background:var(--c-bg);
  -webkit-font-smoothing:antialiased;
}
a{color:var(--c-accent); text-decoration:none}
a:hover{text-decoration:underline}
button{font-family:inherit}
h1,h2,h3,h4{margin:0; font-weight:var(--fw-semibold)}
.num,.mono,td.mono,th,table td.num,.kv .v,.v.tnum{font-variant-numeric:tabular-nums}
td.num,th.num,.num{text-align:right}
:focus-visible{outline:2px solid var(--c-accent); outline-offset:1px}
.dim{color:var(--c-fg-muted)}
.subtle{color:var(--c-fg-subtle)}
.mono{font-family:var(--font-mono)}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important}
}

/* ============================================================
   ③ 应用壳层（02 §6.0 三区 Grid）
   ============================================================ */
#shell{display:grid; grid-template-areas:"top top" "nav main"; grid-template-columns:var(--layout-nav-w) minmax(0,1fr);
  grid-template-rows:auto minmax(0,1fr); height:100dvh}
#topbar{grid-area:top; z-index:var(--z-topbar)}
#sidenav{grid-area:nav; border-right:1px solid var(--c-border); background:var(--c-surface-1); overflow-y:auto; min-height:0}
#main{grid-area:main; overflow-y:auto; min-height:0}
.main-inner{max-width:var(--layout-max); margin:0 auto; padding:var(--density-main-pad)}

/* TopBar（02 §6.1） */
#topbar{display:flex; align-items:center; gap:var(--sp-3); padding:var(--topbar-pad); min-height:var(--layout-topbar-h);
  background:var(--topbar-bg); backdrop-filter:var(--topbar-blur);
  border-bottom:1px solid var(--c-border); position:sticky; top:0}
.logo{font-weight:var(--fw-semibold); font-size:var(--fs-lg); white-space:nowrap}
.logo em{color:var(--c-accent); font-style:normal; font-weight:var(--fw-regular); font-size:var(--fs-sm); margin-left:6px}
.topbar-sub{color:var(--c-fg-muted); font-size:var(--fs-sm); display:flex; gap:var(--sp-3); white-space:nowrap}
.spacer{flex:1}
.tb-btn{background:transparent; border:1px solid var(--c-border); color:var(--c-fg-muted); border-radius:var(--r-1);
  height:var(--density-control-h); min-width:32px; padding:0 var(--sp-2h); cursor:pointer; font-size:var(--fs-md); transition:all var(--dur-fast)}
.tb-btn:hover{border-color:var(--c-accent); color:var(--c-fg)}
#nav-toggle{display:none}
.role-preview{background:var(--c-surface-3); border:1px solid var(--c-border); color:var(--c-fg); border-radius:var(--r-1);
  height:var(--density-control-h); padding:0 var(--sp-2); font-size:var(--fs-sm); cursor:pointer}

/* SideNav（02 §6.2） */
.nav-glabel{font-size:var(--fs-2xs); letter-spacing:var(--ls-group); text-transform:uppercase; color:var(--c-fg-muted);
  padding:var(--sp-4) var(--sp-4) var(--sp-1); font-weight:var(--fw-semibold)}
.nav button{display:flex; align-items:center; gap:var(--sp-2h); width:100%; text-align:left; background:transparent; border:0;
  color:var(--c-fg-muted); font-size:var(--fs-md); padding:var(--nav-item-pad); cursor:pointer;
  border-left:var(--nav-item-indicator-w) solid transparent; transition:background var(--dur-fast), color var(--dur-fast)}
.nav button:hover{background:var(--c-surface-hover); color:var(--c-fg)}
.nav button.on{color:var(--c-fg); font-weight:var(--fw-semibold); background:color-mix(in srgb,var(--c-accent) 14%,transparent); border-left-color:var(--c-accent)}
.nv-ic{width:18px; display:inline-block; text-align:center; color:var(--c-fg-muted)}
.nav button.on .nv-ic{color:var(--c-accent)}
.nav-badge{margin-left:auto; font-size:var(--fs-2xs); background:var(--c-danger-bg); color:var(--c-danger);
  border:1px solid var(--c-danger-border); border-radius:var(--r-full); padding:0 6px}
.nav-foot{margin-top:var(--sp-4); padding:var(--sp-3) var(--sp-4) var(--sp-6); border-top:1px solid var(--c-border);
  display:flex; flex-direction:column; gap:var(--sp-2h); font-size:var(--fs-sm); color:var(--c-fg-muted)}
.nav-foot .row{display:flex; align-items:center; justify-content:space-between; gap:var(--sp-2)}
.nav-foot select{background:var(--c-surface-3); border:1px solid var(--c-border); color:var(--c-fg); border-radius:var(--r-1); padding:2px 6px; font-size:var(--fs-sm)}

/* ============================================================
   ④ 主内容通用（面包屑 / 区块标题 / 卡片 / KPI）
   ============================================================ */
.crumb{font-size:var(--fs-xs); color:var(--c-fg-muted); margin-bottom:var(--sp-2h)}
.crumb b{color:var(--c-fg); font-weight:var(--fw-medium)}
.page-head{display:flex; align-items:flex-end; justify-content:space-between; gap:var(--sp-4); margin-bottom:var(--sp-4); flex-wrap:wrap}
.page-head h1{font-size:var(--fs-xl)}
.page-head .lead{color:var(--c-fg-muted); font-size:var(--fs-sm); margin-top:2px}
.actions{display:flex; gap:var(--sp-2); flex-wrap:wrap}

h2.sec{font-size:var(--fs-md); font-weight:var(--fw-semibold); display:flex; align-items:center; gap:var(--sp-2h);
  margin:var(--sp-6) 0 var(--sp-3)}
h2.sec::before{content:""; width:3px; height:14px; background:var(--c-accent); border-radius:2px; display:inline-block}
h2.sec .hint{font-weight:var(--fw-regular); color:var(--c-fg-muted); font-size:var(--fs-sm)}

.cards{display:grid; grid-template-columns:var(--grid-cards-4); gap:var(--grid-gap)}
.card{background:var(--c-surface-1); border:1px solid var(--c-border); border-radius:var(--r-2); padding:var(--density-card-pad); transition:border-color var(--dur-fast)}
.card:hover{border-color:var(--c-border-hover)}
.card .k{font-size:var(--fs-xs); text-transform:uppercase; letter-spacing:var(--ls-label); color:var(--c-fg-muted); font-weight:var(--fw-semibold)}
.card .v{font-size:var(--fs-2xl); font-weight:var(--fw-kpi); letter-spacing:var(--ls-tight); font-family:var(--font-num);
  font-variant-numeric:tabular-nums; margin:var(--sp-1) 0; line-height:var(--lh-tight)}
.card .v.warn{color:var(--c-warn)} .card .v.danger{color:var(--c-danger)} .card .v.ok{color:var(--c-ok)}
.card .sub{border-top:1px dashed var(--c-border); padding-top:var(--sp-2); margin-top:var(--sp-2); font-size:var(--fs-xs); color:var(--c-fg-muted)}
.card .v.big{font-size:var(--fs-3xl)}
.block{background:var(--c-surface-1); border:1px solid var(--c-border); border-radius:var(--r-2); padding:var(--density-card-pad); margin-top:var(--sp-3); overflow-x:auto}
.two{display:grid; grid-template-columns:var(--grid-two); gap:var(--grid-gap); margin-top:var(--sp-3)}
.two .block{margin-top:0}

/* ============================================================
   ⑤ 表格（02 §5.3）
   ============================================================ */
table{width:100%; border-collapse:collapse; font-size:var(--fs-md)}
th{font-size:var(--fs-xs); text-transform:uppercase; letter-spacing:.04em; color:var(--c-fg-muted); font-weight:var(--fw-semibold);
  text-align:left; padding:var(--density-cell-pad-y) var(--density-cell-pad-x); border-bottom:1px solid var(--c-border); white-space:nowrap; background:var(--c-surface-1)}
td{padding:var(--density-cell-pad-y) var(--density-cell-pad-x); border-bottom:1px solid var(--c-border-subtle); vertical-align:middle}
tbody tr:hover{background:var(--c-surface-2)}
td.act{text-align:right; white-space:nowrap}
td.act button{margin-left:var(--sp-1)}
tr.click{position:relative}
/* 可点击行：.row-act 撑满整行的真实按钮（P1-3 修复，对齐 02 §5.3 / 03 §9.4） */
tr.click .row-act{position:absolute; inset:0; width:100%; height:100%; padding:0; margin:0; border:0; background:transparent;
  opacity:0; cursor:pointer; font:inherit; color:inherit; text-align:left}
tr.click .row-act:focus{outline:none}
tr.click .row-act:focus-visible{outline:2px solid var(--c-accent); outline-offset:-2px; opacity:1; background:var(--c-surface-2)}

/* ============================================================
   ⑥ 按钮 / 输入（02 §5.1 §5.2）
   ============================================================ */
button.b,label.b{border-radius:var(--btn-radius); height:var(--density-control-h); padding:0 var(--btn-pad-x); font-size:var(--fs-sm);
  background:var(--c-surface-3); border:1px solid var(--c-border); color:var(--c-fg); cursor:pointer;
  display:inline-flex; align-items:center; gap:var(--btn-gap); transition:all var(--dur-fast)}
button.b:hover{border-color:var(--c-accent)}
button.b:active{transform:translateY(1px)}
button.b:disabled{opacity:var(--btn-disabled-opacity); cursor:not-allowed}
button.b:hover,label.b:hover{border-color:var(--c-accent)}
button.b:active,label.b:active{transform:translateY(1px)}
/* AC-03 / P2-10：锚点定位高亮（#/diag/cheat-reason 等） */
.anchor-target{outline:2px solid var(--c-accent); outline-offset:2px; border-radius:var(--r-2)}
button.pri{background:var(--btn-primary-bg); border-color:var(--btn-primary-bg); color:var(--btn-primary-fg); font-weight:var(--fw-semibold); font-size:var(--fs-md)}
button.pri:hover{background:var(--btn-primary-bg-hover); border-color:var(--btn-primary-bg-hover)}
button.danger{background:transparent; border-color:var(--btn-danger-border); color:var(--btn-danger-fg)}
button.danger:hover{background:var(--btn-danger-bg-hover)}
button.bare{background:transparent; border:0; color:var(--c-fg-muted); height:auto; padding:2px 6px}
button.bare:hover{color:var(--c-fg); background:var(--c-surface-3); border-radius:var(--r-1)}
input[type=text],input[type=search],input[type=email],input[type=number],select,textarea{
  background:var(--input-bg); border:1px solid var(--input-border); color:var(--c-fg); border-radius:var(--input-radius);
  height:var(--input-h); padding:0 var(--sp-2h); font-size:var(--fs-base); width:100%}
textarea{height:auto; padding:var(--input-pad); line-height:var(--lh-base); resize:vertical}
input:hover,select:hover,textarea:hover{border-color:var(--input-border-hover)}
input:focus,select:focus,textarea:focus{outline:none; border-color:var(--input-border-focus); box-shadow:var(--input-focus-ring)}
input[type=search]{max-width:280px}
.f{display:grid; grid-template-columns:130px 1fr; gap:var(--sp-2h); align-items:start; margin-bottom:var(--sp-3)}
.f > label{font-size:var(--fs-sm); color:var(--c-fg-muted); padding-top:7px}
.f .help{grid-column:2; font-size:var(--fs-xs); color:var(--c-fg-subtle); margin-top:var(--sp-1)}
.inline-form{display:flex; gap:var(--sp-2); align-items:center; flex-wrap:wrap}
.inline-form input[type=text]{max-width:360px}

/* ============================================================
   ⑦ 徽标 / 进度条 / 提示（02 §5.6 §5.7 §5.8）
   ============================================================ */
.chip{display:inline-flex; align-items:center; gap:var(--sp-1); border-radius:var(--chip-radius); padding:var(--chip-pad); font-size:var(--fs-sm);
  border:1px solid var(--c-border); background:var(--c-surface-3); color:var(--c-fg-muted); white-space:nowrap}
.chip .dot{width:var(--chip-dot-size); height:var(--chip-dot-size); border-radius:50%; background:currentColor; display:inline-block}
.chip.g{color:var(--c-ok); border-color:var(--c-ok-border); background:var(--c-ok-bg)}
.chip.y{color:var(--c-warn); border-color:var(--c-warn-border); background:var(--c-warn-bg)}
.chip.r{color:var(--c-danger); border-color:var(--c-danger-border); background:var(--c-danger-bg)}
.chip.b{color:var(--c-info); border-color:var(--c-info-border); background:var(--c-info-bg)}
.chip.n{color:var(--c-neutral)}
.chip.tier-free{color:var(--c-tier-free); border-color:var(--c-tier-free-border); background:var(--c-tier-free-bg)}
.chip.tier-std{color:var(--c-tier-standard); border-color:var(--c-tier-standard-border); background:var(--c-tier-standard-bg)}
.chip.tier-pro{color:var(--c-tier-pro); border-color:var(--c-tier-pro-border); background:var(--c-tier-pro-bg)}
.bar{display:inline-block; width:70px; height:var(--bar-h-inline); border-radius:var(--r-full); background:var(--c-surface-3); overflow:hidden; vertical-align:middle}
.bar > i{display:block; height:100%; background:var(--c-ok); border-radius:var(--r-full); transition:width var(--dur-bar)}
.bar > i.y{background:var(--c-warn)} .bar > i.r{background:var(--c-danger)} .bar > i.b{background:var(--c-accent)}
.pcttxt{font-size:var(--fs-xs); color:var(--c-fg-muted); margin-left:5px; font-variant-numeric:tabular-nums}
.hbar{display:grid; grid-template-columns:minmax(80px,180px) 1fr 64px; gap:var(--sp-2h); align-items:center; margin:var(--sp-1) 0; font-size:var(--fs-sm)}
.hbar .track{background:var(--c-surface-3); border-radius:var(--r-full); height:var(--bar-h-block); overflow:hidden}
.hbar .track > i{display:block; height:100%; background:var(--c-accent); border-radius:var(--r-full)}
.hbar .track > i.ok{background:var(--c-ok)} .hbar .track > i.warn{background:var(--c-warn)} .hbar .track > i.r{background:var(--c-danger)}
.hbar .vl{text-align:right; font-variant-numeric:tabular-nums; color:var(--c-fg-muted)}
.note{border:1px solid var(--c-border); background:var(--c-surface-2); border-radius:var(--r-1); padding:var(--sp-2h) var(--sp-3);
  font-size:var(--fs-sm); line-height:var(--lh-relaxed); color:var(--c-fg); margin:var(--sp-3) 0}
.note.warn{border-color:var(--c-warn-border); background:var(--c-warn-bg)}
.note.bad{border-color:var(--c-danger-note-border); background:var(--c-danger-bg)}
.note.ok{border-color:var(--c-ok-border); background:var(--c-ok-bg)}
.note b{font-weight:var(--fw-semibold)}
.banner{display:flex; align-items:center; gap:var(--sp-2h); border-radius:var(--r-1); padding:var(--sp-2h) var(--sp-3);
  font-size:var(--fs-sm); border:1px solid var(--c-border); background:var(--c-surface-2); margin-bottom:var(--sp-3); cursor:pointer}
.banner.g{border-color:var(--c-ok-border); background:var(--c-ok-bg); color:var(--c-ok)}
.banner.y{border-color:var(--c-warn-border); background:var(--c-warn-bg); color:var(--c-warn)}
.banner.r{border-color:var(--c-danger-border); background:var(--c-danger-bg); color:var(--c-danger)}
.banner .txt{color:var(--c-fg)}
pre,code.k{font-family:var(--font-mono); font-size:var(--fs-sm)}
pre{background:var(--c-surface-code); border:1px solid var(--c-border); border-radius:var(--r-1); padding:var(--sp-3);
  overflow-x:auto; line-height:var(--lh-relaxed); margin:var(--sp-2) 0}
.secret{background:var(--c-surface-code); border:1px solid var(--c-accent); border-radius:var(--r-1); padding:var(--sp-3);
  font-family:var(--font-mono); font-size:var(--fs-base); word-break:break-all; color:var(--c-fg); display:flex; align-items:center; justify-content:space-between; gap:var(--sp-3)}

/* ============================================================
   ⑧ 抽屉 / 遮罩 / Toast（02 §5.4 §5.8 §7.2）
   ============================================================ */
#scrim{position:fixed; inset:0; background:var(--scrim-bg); z-index:var(--z-scrim); opacity:0; pointer-events:none; transition:opacity var(--dur-slow)}
#scrim.on{opacity:1; pointer-events:auto}
#drawer{position:fixed; top:0; right:0; bottom:0; width:var(--drawer-w); background:var(--c-surface-1); border-left:1px solid var(--c-border);
  box-shadow:var(--sh-drawer); z-index:var(--z-drawer); transform:translateX(101%); transition:transform var(--dur-slow) var(--ease-standard);
  display:flex; flex-direction:column}
#drawer.on{transform:none}
#drawer:focus{outline:none}
#drawer .dh{display:flex; align-items:center; justify-content:space-between; gap:var(--sp-2); padding:var(--drawer-head-pad); border-bottom:1px solid var(--c-border)}
#drawer .dh h3{font-size:var(--fs-base)}
#drawer .db{padding:var(--drawer-body-pad); overflow-y:auto; flex:1}
#drawer .df{padding:var(--drawer-foot-pad); border-top:1px solid var(--c-border); display:flex; gap:var(--sp-2); justify-content:flex-end}
.step{display:flex; gap:var(--sp-2h); font-size:var(--fs-sm); padding:var(--sp-1) 0; font-family:var(--font-mono)}
.step .t{color:var(--c-fg-muted); width:70px; text-align:right; flex:none}
.step .st{width:52px; flex:none; font-weight:var(--fw-semibold)}
.step .st.ok{color:var(--c-ok)} .step .st.fail{color:var(--c-danger)}
#toast{position:fixed; bottom:var(--sp-5); left:50%; transform:translateX(-50%); z-index:var(--z-toast);
  display:flex; flex-direction:column; gap:var(--sp-2); max-width:var(--toast-max-w); width:max-content}
#toast > div{background:var(--c-surface-1); border:1px solid var(--c-border); border-left:var(--toast-left-w) solid var(--c-info); border-radius:var(--r-2);
  padding:var(--toast-pad); box-shadow:var(--sh-2); font-size:var(--fs-sm)}
#toast > div.g{border-left-color:var(--c-ok)} #toast > div.y{border-left-color:var(--c-warn)} #toast > div.r{border-left-color:var(--c-danger)}

/* ============================================================
   ⑨ 空态 / 骨架屏（02 §5.9 §5.10）
   ============================================================ */
.empty{text-align:center; color:var(--c-fg-muted); padding:var(--empty-pad); font-size:var(--empty-font-size)}
.empty .ic{font-size:var(--empty-icon-size); opacity:.6; margin-bottom:var(--sp-2)}
.skel{background:var(--c-surface-2); border-radius:var(--skel-radius); position:relative; overflow:hidden; height:var(--skel-h); margin:var(--sp-2) 0}
.skel::after{content:""; position:absolute; inset:0; background:linear-gradient(90deg,transparent,rgba(255,255,255,.06),transparent);
  animation:sheen var(--dur-sheen) infinite linear}
:root[data-theme="light"] .skel::after{background:linear-gradient(90deg,transparent,rgba(0,0,0,.05),transparent)}
@keyframes sheen{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.skel.w60{width:60%} .skel.w80{width:80%} .skel.w40{width:40%}

/* ============================================================
   ⑩ 页面专用（Tab / 套餐卡 / 阶梯 / 可用性条 / 合规卡）
   ============================================================ */
.tabs{display:flex; gap:var(--sp-1); border-bottom:1px solid var(--c-border); margin-bottom:var(--sp-3); flex-wrap:wrap}
.tabs button{background:transparent; border:0; border-bottom:2px solid transparent; color:var(--c-fg-muted); cursor:pointer;
  padding:var(--sp-2) var(--sp-3); font-size:var(--fs-md); display:inline-flex; align-items:center; gap:6px}
.tabs button.on{color:var(--c-fg); border-bottom-color:var(--c-accent); font-weight:var(--fw-semibold)}
.tabs .cnt{font-size:var(--fs-2xs); background:var(--c-danger-bg); color:var(--c-danger); border:1px solid var(--c-danger-border); border-radius:var(--r-full); padding:0 6px}
.plans{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:var(--grid-gap)}
.plan{background:var(--c-surface-1); border:1px solid var(--c-border); border-radius:var(--r-2); padding:var(--sp-5); display:flex; flex-direction:column; gap:var(--sp-3)}
.plan.current{border-color:var(--c-accent)}
.plan .tierchip{margin-bottom:var(--sp-1)}
.plan .price{font-size:var(--fs-2xl); font-weight:var(--fw-kpi); font-family:var(--font-num); letter-spacing:var(--ls-tight)}
.plan .price small{font-size:var(--fs-sm); color:var(--c-fg-muted); font-weight:var(--fw-regular)}
.plan ul{margin:0; padding:0; list-style:none; font-size:var(--fs-sm); color:var(--c-fg-muted); display:flex; flex-direction:column; gap:6px}
.plan ul li{display:flex; gap:var(--sp-2); align-items:flex-start}
.plan ul li::before{content:"●"; color:var(--c-accent); font-size:9px; line-height:1.8}
.plan ul li.off::before{content:"○"; color:var(--c-fg-subtle)}
.plan ul li.off{color:var(--c-fg-subtle)}
.ladder{font-family:var(--font-mono); font-size:var(--fs-sm); display:flex; align-items:center; gap:var(--sp-2); flex-wrap:wrap}
.ladder .node{background:var(--c-surface-3); border:1px solid var(--c-border); border-radius:var(--r-1); padding:2px 8px}
.ladder .arrow{color:var(--c-accent)}
.ladder .cross{border-color:var(--c-tier-pro-border); color:var(--c-tier-pro)}
.uptime{display:flex; gap:2px; align-items:flex-end}
.uptime i{flex:1; height:28px; border-radius:2px; background:var(--c-ok)}
.uptime i.y{background:var(--c-warn)} .uptime i.r{background:var(--c-danger)}
.grid-2{display:grid; grid-template-columns:1fr 1fr; gap:var(--grid-gap)}
.grid-3{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:var(--grid-gap)}
.kv{display:grid; grid-template-columns:auto 1fr; gap:var(--sp-2) var(--sp-4); font-size:var(--fs-sm)}
.kv dt{color:var(--c-fg-muted)} .kv dd{margin:0; font-variant-numeric:tabular-nums}
.docs{display:grid; grid-template-columns:200px minmax(0,1fr) 160px; gap:var(--sp-5)}
.docs .toc{position:sticky; top:var(--sp-4); align-self:start; font-size:var(--fs-sm)}
.docs .toc a{display:block; padding:3px 0; color:var(--c-fg-muted)} .docs .toc a:hover{color:var(--c-fg)}
.pill-tabs{display:inline-flex; gap:var(--sp-1); background:var(--c-surface-3); border:1px solid var(--c-border); border-radius:var(--r-1); padding:2px}
.pill-tabs button{background:transparent; border:0; color:var(--c-fg-muted); padding:3px 10px; border-radius:var(--r-sm); cursor:pointer; font-size:var(--fs-sm)}
.pill-tabs button.on{background:var(--c-accent-strong); color:var(--c-fg-invert)}
.three-stage{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:var(--grid-gap); margin-top:var(--sp-3)}
.stage{background:var(--c-surface-1); border:1px solid var(--c-border); border-radius:var(--r-2); padding:var(--sp-3); position:relative}
.stage.on{border-color:var(--c-accent)}
.stage .n{font-size:var(--fs-2xs); color:var(--c-fg-muted); text-transform:uppercase; letter-spacing:var(--ls-label)}
.stage h4{font-size:var(--fs-md); margin:var(--sp-1) 0}
.stage p{font-size:var(--fs-sm); color:var(--c-fg-muted); margin:var(--sp-1) 0 var(--sp-2)}
.metric-tile{display:flex; flex-direction:column; gap:2px}
.metric-tile .mv{font-family:var(--font-num); font-variant-numeric:tabular-nums; font-size:var(--fs-xl); font-weight:var(--fw-semibold)}
.ratingmatrix td.c{text-align:center}
details.faq{border:1px solid var(--c-border); border-radius:var(--r-1); padding:var(--sp-2h) var(--sp-3); margin-bottom:var(--sp-2); background:var(--c-surface-1)}
details.faq summary{cursor:pointer; font-size:var(--fs-md); font-weight:var(--fw-medium)}
details.faq p{font-size:var(--fs-sm); color:var(--c-fg-muted); margin:var(--sp-2) 0 0}
.up{color:var(--c-ok)} .down{color:var(--c-danger)}
.ro{color:var(--c-fg-muted)}
.roleobx{display:flex; gap:var(--sp-2); align-items:center}

/* ≤1020px：主从两栏 / KPI 折列（02 §4.3） */
@media (max-width:1020px){
  .cards{grid-template-columns:var(--grid-cards-2)}
  .two{grid-template-columns:1fr}
  .plans{grid-template-columns:1fr}
  .docs{grid-template-columns:1fr}
  .docs .toc{position:static}
  .three-stage,.grid-3{grid-template-columns:1fr}
}
/* ≤960px：侧栏收进抽屉（02 §6.0） */
@media (max-width:960px){
  #shell{grid-template-areas:"top" "main"; grid-template-columns:1fr}
  #sidenav{position:fixed; top:0; bottom:0; left:0; width:var(--layout-nav-w-narrow); z-index:var(--z-nav);
    transform:translateX(-100%); transition:transform var(--dur-slow) var(--ease-standard)}
  #sidenav.on{transform:none}
  #nav-toggle{display:inline-flex}
  #navscrim{position:fixed; inset:0; background:var(--scrim-bg); z-index:var(--z-navscrim); opacity:0; pointer-events:none; transition:opacity var(--dur-slow)}
  #navscrim.on{opacity:1; pointer-events:auto}
  .topbar-sub .hide-narrow{display:none}
}
@media (max-width:720px){
  .cards{grid-template-columns:1fr}
  .f{grid-template-columns:1fr}
  .f > label{padding-top:0}
  .grid-2{grid-template-columns:1fr}
}
</style>
</head>
<body>
<!-- ============================================================ 壳层（02 §6.0） -->
<div id="shell">
  <!-- TopBar（02 §6.1 / 规格 §1.4） -->
  <header id="topbar">
    <button class="tb-btn" id="nav-toggle" aria-label="打开导航">☰</button>
    <div class="logo">api&#8209;relay <em class="hide-narrow">管理面板</em></div>
    <div class="topbar-sub">
      <span class="hide-narrow">v1.0.0</span>
      <span class="hide-narrow" id="clock"></span>
      <span title="数据新鲜度">新鲜度 <b id="fresh">—</b></span>
      <span class="chip" title="原型：本页所有数值为示意数据，非真实统计">示意</span>
    </div>
    <div class="spacer"></div>
    <div class="roleobx">
      <label class="dim" style="font-size:var(--fs-xs)">角色预览</label>
      <select class="role-preview" id="role-select" aria-label="角色预览">
        <option value="owner">管理员 owner</option>
        <option value="sre">运维 sre</option>

        <option value="auditor">审计 auditor</option>
        <option value="client">客户 client</option>
      </select>
    </div>
    <button class="tb-btn" id="density-btn" title="切换密度（compact/cozy）">▤</button>
    <button class="tb-btn" id="theme-btn" title="切换主题（暗/亮）">◐</button>
    <button class="tb-btn" id="refresh-btn" title="刷新">↻</button>
    <button class="tb-btn" id="logout-btn" title="退出">⎋</button>
  </header>
  <!-- SideNav（由脚本按角色渲染，02 §6.2） -->
  <aside id="sidenav" class="nav" aria-label="主导航"></aside>
  <!-- 主内容（唯一滚动容器） -->
  <main id="main"><div class="main-inner" id="view" tabindex="-1"></div></main>
</div>
<nav id="navscrim" aria-hidden="true"></nav>
<div id="scrim"></div>
<!-- 抽屉（02 §5.4；规格 §1.4 / I1 / I13） -->
<aside id="drawer" tabindex="-1" role="dialog" aria-modal="true" aria-labelledby="drawer-title">

  <div class="db" id="drawer-body"></div>
  <div class="df" id="drawer-foot"></div>
</aside>
<div id="toast" aria-live="polite"></div>

<!-- ============================================================ 客户面页面模板 -->
<!-- §3.A.1 开发者控制台概览 #/portal -->
<template id="tpl-portal">

        </select>

  </div>

  <!-- KPI 4 列（§3.A.1 字段表） -->
  <div class="cards">
    <div class="card"><div class="k">本周期 Token</div><div class="v">1,284,930</div><div class="sub">输入 812,400 · 输出 472,530</div></div>
    <div class="card"><div class="k">本周期成本</div><div class="v">¥7.4200</div><div class="sub">按 token 计费 · 不含税</div></div>
    <div class="card"><div class="k">预算余额</div><div class="v">¥2.5800</div><div class="sub">已用 <span class="bar"><i class="y" style="width:78%"></i></span> <span class="pcttxt">78%</span></div></div>
    <div class="card"><div class="k">请求成功率</div><div class="v ok">99.62%</div><div class="sub">失败 0.38% · 自动恢复 12 次</div></div>
  </div>

  <div class="two">
    <div>
      <h2 class="sec">近 24h 用量 <span class="hint">tokens / 小时（示意）</span></h2>
      <div class="block">
        <div class="hbar"><span>00:00–06:00</span><span class="track"><i style="width:22%"></i></span><span class="vl">142K</span></div>
        <div class="hbar"><span>06:00–12:00</span><span class="track"><i style="width:64%"></i></span><span class="vl">418K</span></div>
        <div class="hbar"><span>12:00–18:00</span><span class="track"><i style="width:100%"></i></span><span class="vl">655K</span></div>
        <div class="hbar"><span>18:00–24:00</span><span class="track"><i class="warn" style="width:41%"></i></span><span class="vl">270K</span></div>
      </div>
      <h2 class="sec">最近请求</h2>
      <div class="block">
        <table>
          <thead><tr><th>时间</th><th>模型</th><th>结果</th><th class="num">耗时</th><th class="num">token</th></tr></thead>
          <tbody>
            <tr><td class="mono">10:41:22</td><td class="mono">mimo-v2.5-pro</td><td><span class="chip g"><span class="dot"></span>200</span></td><td class="num">1.2s</td><td class="num">3,204</td></tr>
            <tr><td class="mono">10:40:05</td><td class="mono">mimo-v2.5</td><td><span class="chip g"><span class="dot"></span>200</span></td><td class="num">840ms</td><td class="num">1,180</td></tr>
            <tr><td class="mono">10:38:51</td><td class="mono">旗舰</td><td><span class="chip y">▲ 429 已自动重试</span></td><td class="num">2.6s</td><td class="num">2,940</td></tr>
          </tbody>
        </table>
      </div>
    </div>
    <div>
      <h2 class="sec">我的密钥</h2>
      <div class="block">
        <div class="kv">
          <dt>脱敏</dt><dd class="mono">sk&#8209;relay&#8209;••••••••&#8209;4f2a</dd>
          <dt>指纹</dt><dd class="mono">a91c04ef</dd>
          <dt>状态</dt><dd><span class="chip g"><span class="dot"></span>生效中</span></dd>
        </div>
        <div class="actions" style="margin-top:var(--sp-3)"><button class="b" data-goto="keys">查看 / 轮换 →</button></div>
      </div>
      <h2 class="sec">套餐</h2>
      <div class="block">
        <div class="kv"><dt>当前</dt><dd>标准 standard</dd><dt>圈定模型</dt><dd>4 个</dd><dt>预算</dt><dd>¥10.0000</dd></div>

  <details class="faq"><summary>计费用什么口径？</summary><p>两个独立口径：额度(token) 管"给多少量"，预算(¥) 管"给多少预算"。钱按钱算——同样 ¥10 折成 token 取决于输入输出比例，用 token 额度冒充只能猜。</p></details>
  <details class="faq"><summary>预算花完会怎样？</summary><p>返回 <b>402</b>（不是 429）。这是"没钱了"而非"被限流"，客户端**不要**重试，请升级套餐。</p></details>
  <details class="faq"><summary>怎么升级套餐？</summary><p>在套餐卡点「选择此套餐」提交申请 → 运营审批 → 签发新 key（白名单与预算更新）。</p></details>
  <details class="faq"><summary>阶梯换了模型我会知道吗？</summary><p>会。响应头回显 <code class="k">x-relay-model-requested</code> / <code class="k">x-relay-model-served</code> / <code class="k">x-relay-ladder</code>，界面也显示"本次由第几阶答"。</p></details>
</template>

  /* ---------- 导航渲染 ---------- */
  function navDef(){ if(role==='client') return NAV_CLIENT; return navOldOrder?NAV_ADMIN_OLD:NAV_ADMIN; }
  function renderNav(){
    sidenav.innerHTML='';
    navDef().forEach(function(g){
      var lb=document.createElement('div'); lb.className='nav-glabel'; lb.textContent=g.label; sidenav.appendChild(lb);
      g.items.forEach(function(it){
        var b=document.createElement('button'); var isPrev=it[0]==='__portal__';
        if(!isPrev && it[0]===currentTab) b.className='on';
        b.setAttribute('data-tab',isPrev?'portal':it[0]);
        if(isPrev) b.setAttribute('data-preview','1');
        b.innerHTML='<span class="nv-ic">'+it[2]+'</span><span>'+it[1]+'</span>'+
          (it[0]==='approvals'?'<span class="nav-badge">3</span>':'');
        sidenav.appendChild(b);
      });
    });
    // nav-foot（全局控件沉底，02 §6.2）
    var foot=document.createElement('div'); foot.className='nav-foot';
    foot.innerHTML='<div class="row"><span>窗口</span><select id="nf-win"><option>5m</option><option>1h</option><option selected>24h</option><option>7d</option></select></div>'+
      '<div class="row"><span>自动刷新</span><label><input type="checkbox" id="nf-auto" checked> 开</label></div>'+
      '<div class="row"><span>刷新间隔</span><select id="nf-int"><option>15s</option><option>30s</option><option>60s</option></select></div>'+
      '<div class="dim" style="font-size:var(--fs-2xs)">原型 · 数据为示意 · 零外部依赖</div>';
    sidenav.appendChild(foot);
  }
  sidenav.addEventListener('click',function(e){
    var b=e.target.closest('button[data-tab]'); if(!b) return;
    var t=b.getAttribute('data-tab');
    if(b.getAttribute('data-preview')){ setRole('client'); toast('已切到「客户门户预览」视角','g'); return; }
    goto(t);
  });

  /* ---------- 路由 ---------- */
  var currentTab=(location.hash||'#/ov').replace(/^#\/?/,'').split('/')[0]||'ov';
  function visibleTabs(){ return role==='client'?CLIENT_TABS.slice():(['ov','met','ledger','diag','users','tenants','approvals','plans','route','ch','billing','observ','instances','ops','trust','audit','agent']); }
  function goto(t){
    if(visibleTabs().indexOf(t)<0) t=(role==='client'?'portal':'ov');
    currentTab=t; location.hash='#/'+t; renderNav(); render();
    sidenav.classList.remove('on'); navscrim.classList.remove('on');
    view.focus();
  }
  window.addEventListener('hashchange',function(){
    var t=(location.hash||'#/ov').replace(/^#\/?/,'').split('/')[0]||'ov';
    if(t!==currentTab){ currentTab=t; renderNav(); render(); }
    else { applyAnchor(); }
  });

  /* ---------- 锚点定位（AC-03 / P2-10） ---------- */
  function anchorId(){ var p=(location.hash||'').replace(/^#\/?/,'').split('/'); return p.length>1?p[1]:''; }
  var _anchorTimer=null;
  function applyAnchor(){
    var id=anchorId(); if(!id) return;
    var el=view.querySelector('[id="'+id+'"]'); if(!el) return;
    Array.prototype.forEach.call(view.querySelectorAll('.anchor-target'),function(n){ n.classList.remove('anchor-target'); });
    try{ el.scrollIntoView({block:'start',behavior:'smooth'}); }catch(_){ try{ el.scrollIntoView(); }catch(__){} }
    el.classList.add('anchor-target');
    if(_anchorTimer) clearTimeout(_anchorTimer);
    _anchorTimer=setTimeout(function(){ el.classList.remove('anchor-target'); },2200);
  }

  /* ---------- 页面渲染 ---------- */
  function render(){
    var tpl=document.getElementById('tpl-'+currentTab);
    if(!tpl){ view.innerHTML='<div class="empty"><div class="ic">○</div><div>页面「'+currentTab+'」暂未在原型中实现</div></div>'; return; }
    var html=tpl.innerHTML.replace(/\*\*([^*\n]+?)\*\*/g,'<b>$1</b>'); // 轻量 markdown 强调
    view.innerHTML=html;
    // 角色可见性过滤（元素可带 data-roles="owner,sre"）
    Array.prototype.forEach.call(view.querySelectorAll('[data-roles]'),function(el){
      var allowed=(el.getAttribute('data-roles')||'').split(',');
      if(allowed.indexOf(role)<0) el.remove();
    });
    afterRender();
    applyAnchor();
  }

  function afterRender(){
    // 90 天可用性条形（#/status）
    var up=view.querySelector('.uptime');
    if(up && !up.children.length){
      for(var i=0;i<90;i++){ var s=document.createElement('i');
        if(i===62||i===55) s.className='y'; if(i===40) s.className='r';
        s.title='第 '+(90-i)+' 天前 · '+(s.className==='r'?'中断':s.className==='y'?'降级':'正常'); up.appendChild(s); }
    }
    // P2-7：表格首载骨架
    firstLoadSkeleton('#keys-table',9); firstLoadSkeleton('#users-table',9); firstLoadSkeleton('#audit-table',6);
    // P1-4：导航重排提示的关闭态 / 开关文案
    var nr=view.querySelector('#nav-reorder-note');
    if(nr){
      var dis=false; try{ dis=localStorage.getItem('proto_nav_note_dismissed')==='1'; }catch(_){}
      if(dis) nr.style.display='none';
      var tb=document.getElementById('toggle-nav-order'); if(tb) tb.textContent=navOldOrder?'按新顺序查看':'按旧顺序查看';
    }

  /* ---------- 事件委托 ---------- */
  document.addEventListener('click',function(e){
    var el;
    if((el=e.target.closest('[data-goto]'))){ goto(el.getAttribute('data-goto')); return; }
    if((el=e.target.closest('[data-copy-sel]'))){ var src=document.querySelector(el.getAttribute('data-copy-sel')); copyText(src?src.textContent.trim():''); return; } /* P2-1 */
    if((el=e.target.closest('[data-copy]'))){ copyText(el.getAttribute('data-copy')); return; }
    if((el=e.target.closest('[data-drawer]'))){ openDrawer(el.getAttribute('data-drawer'),el); return; }
    if((el=e.target.closest('[data-action]'))){ doAction(el.getAttribute('data-action')); return; } /* P1-2 */
    if((el=e.target.closest('[data-export]'))){ doExport(el.getAttribute('data-export'),el.getAttribute('data-fmt')); return; }
    if((el=e.target.closest('[data-kfilter]'))){ filterRows('#keys-table',el.getAttribute('data-kfilter'),'kstate',el); return; }
    if((el=e.target.closest('[data-ufilter]'))){ filterRows('#users-table',el.getAttribute('data-ufilter'),'ustate',el); return; }
    if((el=e.target.closest('[data-apv]'))){ apvTab(el.getAttribute('data-apv'),el); return; }
    if((el=e.target.closest('[data-dim]'))){ routeDim(el.getAttribute('data-dim'),el); return; }
    if((el=e.target.closest('[data-move]'))){ moveCard(el); return; }
    if((el=e.target.closest('.banner[onclick]'))){ return; } // 交给内联 onclick
  });

  /* 搜索（输入） */
  document.addEventListener('input',function(e){
    var t=e.target;
    if(t.id==='keys-search'){ searchTable('#keys-table',t.value,'kstate','all'); }
    if(t.id==='users-search'){ searchTable('#users-table',t.value,'ustate','all'); }
    if(t.id==='audit-search'){ searchTable('#audit-table',t.value,null,'all'); }
  });

  var skelDone={};
  /* P2-7：表格首载骨架（对齐 AC-21） */
  function firstLoadSkeleton(sel,cols){
    if(skelDone[sel]) return; skelDone[sel]=true;
    var tb=document.querySelector(sel+' tbody'); if(!tb) return;
    var real=tb.innerHTML, rows='';
    for(var i=0;i<3;i++){ rows+='<tr><td colspan="'+(cols||9)+'"><div class="skel"></div></td></tr>'; }
    tb.innerHTML=rows;
    setTimeout(function(){ tb.innerHTML=real; },420);
  }
  /* P2-7：筛选/搜索无结果 → 显示空态（对齐 AC-22） */
  function updateKeyEmpty(){
    var tb=document.querySelector('#keys-table tbody'); if(!tb) return;
    var any=false;
    Array.prototype.forEach.call(tb.querySelectorAll('tr'),function(r){ if(r.style.display!=='none') any=true; });
    var e=document.getElementById('keys-empty'); if(e) e.hidden=any;
    var t=document.getElementById('keys-table'); if(t) t.style.display=any?'':'none';
  }
  function searchTable(sel,q){
    var rows=document.querySelectorAll(sel+' tbody tr');
    var k=(q||'').toLowerCase();
    Array.prototype.forEach.call(rows,function(r){
      if(r.classList.contains('tenant-head')) return;
      var txt=(r.getAttribute('data-text')||r.textContent||'').toLowerCase();
      r.style.display=(!k||txt.indexOf(k)>=0)?'':'none';
    });
    if(sel==='#keys-table') updateKeyEmpty();
  }
  function filterRows(sel,flt,attr,btn){
    var sib=btn.parentNode.querySelectorAll('[data-kfilter],[data-ufilter]');
    Array.prototype.forEach.call(sib,function(b){ b.style.fontWeight=''; });
    btn.style.fontWeight='600';
    Array.prototype.forEach.call(document.querySelectorAll(sel+' tbody tr'),function(r){
      if(r.classList.contains('tenant-head')){ r.style.display=''; return; }
      var st=r.getAttribute('data-'+ (attr==='kstate'?'kstate':'ustate'));
      var show = flt==='all' || (flt==='active'&&st==='active') || (flt==='attention'&&st==='attention');
      r.style.display=show?'':'none';
    });
    if(sel==='#keys-table') updateKeyEmpty();
  }
  function apvTab(v,btn){
    btn.parentNode.querySelectorAll('button').forEach(function(b){ b.classList.remove('on'); });
    btn.classList.add('on');
    Array.prototype.forEach.call(document.querySelectorAll('#apv-table tbody tr'),function(r){
      var st=r.getAttribute('data-apv'); r.style.display=(v==='all'||v===st)?'':'none';
    });
  }
  function routeDim(dim,btn){
    btn.parentNode.querySelectorAll('button').forEach(function(b){ b.classList.remove('on'); }); btn.classList.add('on');
    var list=document.getElementById('route-list'); if(!list) return;
    var cards=Array.prototype.slice.call(list.children);
    var keymap={priority:'p',cost:'cost',weight:'weight',latency:'lat'};
    var k=keymap[dim];
    cards.sort(function(a,b){ return (parseFloat(b.getAttribute('data-'+k))||0)-(parseFloat(a.getAttribute('data-'+k))||0); });
    cards.forEach(function(c){ list.appendChild(c); });
    var note=document.getElementById('route-note');
    var txt={priority:'priority 大者优先',cost:'按成本升序（低成本优先，需 providers[].cost）',weight:'按权重降序',latency:'按实测 p95 升序'};
    if(note){ note.innerHTML='当前按 <b>'+dim+'</b> 预览排序：'+txt[dim]+'。切换仅改变**预览排序**，不直接改策略。'.replace(/\*\*([^*\n]+?)\*\*/g,'<b>$1</b>'); }
    toast('路由预览排序：'+dim,'g');
  }
  function moveCard(btn){
    var card=btn.closest('.block'); if(!card) return;
    if(btn.getAttribute('data-move')==='up' && card.previousElementSibling) card.parentNode.insertBefore(card,card.previousElementSibling);
    if(btn.getAttribute('data-move')==='down' && card.nextElementSibling) card.parentNode.insertBefore(card.nextElementSibling,card);
    toast('已调整优先级顺序（未保存）','y');
  }

  /* ---------- 复制 ---------- */
  function copyText(text){
    try{ navigator.clipboard.writeText(text).then(function(){toast('已复制到剪贴板','g');},function(){fallback();}); }
    catch(_){ fallback(); }
    function fallback(){
      try{ var ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
        document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); toast('已复制到剪贴板','g'); }
      catch(e){ toast('复制失败，请手动选中复制','y'); }
    }
  }

  /* ---------- 导出（CSV BOM+CRLF / JSON；02 §1.3 交互） ---------- */
  function doExport(kind,fmt){
    var rows=[['id','备注','指纹','状态','套餐','额度%','预算%','到期'],
      ['k1','生产-主','a91c04ef','生效中','standard','64%','78%','2027-01-01'],
      ['k2','测试-临时','7b3e19aa','将耗尽','standard','92%','100%','2026-11-20']];
    var name=kind+'_'+new Date().toISOString().slice(0,10);
    if(fmt==='json'){
      var obj=rows.slice(1).map(function(r){var o={};rows[0].forEach(function(h,i){o[h]=r[i];});return o;});
      download(name+'.json',JSON.stringify(obj,null,2),'application/json');
    } else {
      var csv=rows.map(function(r){return r.map(csvCell).join(',');}).join('\r\n');
      download(name+'.csv','\ufeff'+csv,'text/csv');
    }
    toast('已导出 '+(fmt==='json'?name+'.json':name+'.csv')+'（示意数据）','g');
  }
  function csvCell(c){ c=String(c==null?'':c); return (c.indexOf(',')>=0||c.indexOf('"')>=0)?'"'+c.replace(/"/g,'""')+'"':c; }
  function download(fn,text,mime){
    try{ var a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([text],{type:mime})); a.download=fn; a.click(); URL.revokeObjectURL(a.href); }
    catch(e){ toast('导出失败：检查浏览器下载权限','r'); }
  }

    if(e.target.id==='load-models'){ loadModels(); }
  });
  function runWhoami(){
    var inp=document.getElementById('whoami-input'), out=document.getElementById('whoami-result');
    if(!inp||!out) return;
    var v=(inp.value||'').trim();
    if(!v){ toast('请先粘贴一个 key','y'); return; }
    out.innerHTML='<span class="dim">自检中…</span>';
    setTimeout(function(){
      // 演示用：按输入内容/长度映射四态之一（真实版由服务端换算指纹判断）
      var states=[
        ['g','● 有效','该 key 由本网关签发且当前生效可用。下一步：直接调用 /v1/chat/completions。'],
        ['r','■ 已禁用','该 key 由本网关签发，但已被停用。下一步：在「我的密钥」启用，或申请新 key。'],
        ['r','■ 已过期','该 key 已过期。下一步：轮换以获得新 key。'],
        ['n','○ 不是本网关当前签发的','未在当前密钥库中找到该指纹。下一步：确认是否用了别的部署/租户的 key。']
      ];
      var idx=(v.length+ (v.charCodeAt(0)||0))%4;
      var s=states[idx];
      out.innerHTML='<div class="note '+(s[0]==='g'?'ok':s[0]==='r'?'bad':s[0]==='y'?'warn':'')+'"><span class="chip '+s[0]+'">'+s[1]+'</span> '+s[2]+'</div>'+
        '<div class="dim" style="font-size:var(--fs-xs);margin-top:6px">指纹示意：sha256("relay-key:"+key) 前 8 位 · 明文不写日志、不落盘、不进台账</div>';
    },420);
  }

    'trace-detail':{t:'请求轨迹 tr_91c2',b:function(){return '<div class="step"><span class="t">+0ms</span><span class="st ok">ok</span><span>auth · key=pro tier=pro</span></div>'+

    'subscribe':{t:'订阅状态更新',b:function(){return '<div class="f"><label>邮箱</label><input type="email" placeholder="you@example.com"></div><div class="note">通知渠道待接入（阶段1 Q10）——本轮仅表达入口。</div>';},f:'<button class="b" data-close>取消</button><button class="b pri" id="sub-go">保存</button>',after:function(){var g=document.getElementById('sub-go');if(g)g.onclick=function(){closeDrawer();toast('已订阅（原型示意）','g');};}},
    'budget-warn':{t:'预算预警',b:function(){return '<div class="kv"><dt>本周期预算</dt><dd>¥10.0000</dd><dt>已用</dt><dd>78%（¥7.42）</dd><dt>超预算行为</dt><dd><span class="chip r">■ 返回 402</span>（不是限流，别重试）</dd></div><div class="note warn">预算耗尽后调用会返回 <b>402</b>，客户端应立即停止重试并升级套餐。</div>';},f:'<button class="b" data-close>关闭</button><button class="b pri" data-goto="plans">升级套餐</button>'},
    'key-invalid':{t:'客户端 key 不对（401）',b:function(){return '<div class="note bad">这是网关自己回的 <b>401 auth_invalid</b>（无上游参与），与"上游拒绝你配置的密钥"是两件事（ADR-016）。</div><div class="kv"><dt>修复①</dt><dd>让客户端换用正确的 key</dd><dt>修复②</dt><dd>到「我的密钥」粘贴自检（whoami）确认四态</dd><dt>证据</dt><dd class="mono">台账按指纹聚合（仅指纹，永不记明文）</dd></div>';},f:'<button class="b" data-close>关闭</button><button class="b" data-goto="keys">去自检</button>'},
    'upstream-invalid':{t:'上游拒绝密钥',b:function(){return '<div class="note warn">命中的是<b>上游返回的密钥错误</b>——修复动作是<b>运维更换上游密钥</b>，与客户端手上的 key 无关。</div>';},f:'<button class="b" data-close>关闭</button><button class="b" data-goto="ch">去上游页</button>'},
    'plan-manage':{t:'套餐管理（运营）',b:function(){return '<div class="note">运营视角：编辑在售套餐的分层、圈定模型白名单与预算闸；下架后客户不可再选购。</div><div class="f"><label>套餐名</label><input type="text" value="标准 standard"></div><div class="f"><label>rpm / 并发</label><input type="text" value="300 / 32"></div>';},f:'<button class="b" data-close>取消</button><button class="b pri" data-close>保存（原型示意）</button>'},
    'trace-stream':{t:'流式中断轨迹 tr_st1（SSE error 帧）',b:function(){return '<div class="step"><span class="t">+0ms</span><span class="st ok">ok</span><span>auth · tier=pro</span></div>'+
      '<div class="step"><span class="t">+2ms</span><span class="st ok">ok</span><span>route · → agnes（priority）model=旗舰（SSE）</span></div>'+

      '<div class="step"><span class="t">+3400ms</span><span class="st fail">FAIL</span><span>stream · 上游第 3 个 chunk 后断连（mid-stream）</span></div>'+

      '<div class="step"><span class="t">+3402ms</span><span class="st ok">ok</span><span><b>inject</b> · 注入 SSE error 帧（pro=full）</span></div>'+
      '<pre id="stream-frame">data: {"error":{"message":"upstream stream interrupted","type":"upstream_error","code":"stream_interrupted","param":null},"relay_attribution":{"failure_reason":"stream_interrupted","suggested_next":{"action":"retry_with_backoff"},"recoverable":true},"choices":[{"delta":{"content":""},"finish_reason":"error"}]}\n\ndata: [DONE]</pre>'+
      '<div class="note">分层投递：<b>free=不注入</b>（纯管道）· standard=header + 最小 error 帧 · pro=完整归因帧。已回传前（响应头未发出）的失败走静默重试，不注入。（REQ-03 验收）</div>';},f:'<button class="b" data-copy-sel="#stream-frame">复制帧示例</button><button class="b" data-close>关闭</button>'},
    'tenant-detail':{t:'租户详情',b:function(){return '<div class="kv"><dt>tenantId</dt><dd class="mono">acme-corp</dd><dt>名称</dt><dd>Acme 科技</dd><dt>隔离级别</dt><dd><span class="chip b">● 逻辑强隔离</span></dd><dt>key 数</dt><dd>2</dd><dt>套餐</dt><dd><span class="chip tier-std">standard</span></dd><dt>越权行为</dt><dd>返回 403 且不泄漏他租户存在性</dd></div><div class="note">REQ-07：所有客户面端点强制 tenantId 谓词；RBAC 与租户隔离叠加；审计留痕。非目标：不做物理隔离。</div>';},f:'<button class="b" data-close>关闭</button>'},
    'tenant-new':{t:'新建租户',b:function(){return '<div class="f"><label>tenantId</label><input type="text" placeholder="如 newco"></div><div class="f"><label>名称</label><input type="text"></div><div class="f"><label>默认套餐</label><select><option>free</option><option selected>standard</option><option>pro</option></select></div>';},f:'<button class="b" data-close>取消</button><button class="b pri" data-close>创建（原型示意）</button>'},
    'state-external':{t:'状态外置详情',b:function(){return '<div class="kv"><dt>state.backend</dt><dd class="mono">redis</dd><dt>Redis</dt><dd class="mono">127.0.0.1:6379 · 连接 0.4ms</dd><dt>限流/配额</dt><dd class="mono">Redis 原子计数</dd><dt>熔断/半开</dt><dd class="mono">全局令牌化半开</dd><dt>故障策略</dt><dd>fail-open 放行 + 记降级事件</dd></div><div class="note">REQ-01/02/09：状态外置分阶段启用；Redis 故障时降级为实例内判定，不因状态层故障拒绝请求。</div>';},f:'<button class="b" data-close>关闭</button>'}
  };

  var shell=document.getElementById('shell');
  /* P1-3：抽屉背景 inert + Tab 首尾回环 */
  function setBackgroundInert(on){
    [shell,document.getElementById('navscrim')].forEach(function(n){ if(!n) return;
      try{ if(on){ n.setAttribute('inert',''); n.setAttribute('aria-hidden','true'); } else { n.removeAttribute('inert'); n.removeAttribute('aria-hidden'); } }catch(_){}
    });
  }
  function drawerFocusables(){
    return Array.prototype.slice.call(drawer.querySelectorAll('a[href],button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])'));
  }
  function openDrawer(kind,trigger){
    var d=DRAWERS[kind]; if(!d){ toast('该抽屉在原型中未实现：'+kind,'y'); return; }
    lastTrigger=trigger||null;
    drawerTitle.textContent=typeof d.t==='function'?d.t():d.t;
    drawerBody.innerHTML=typeof d.b==='function'?d.b():d.b;
    drawerFoot.innerHTML=typeof d.f==='function'?d.f():d.f;
    drawer.classList.add('on'); scrim.classList.add('on');
    if(d.after) d.after();
    setBackgroundInert(true);
    drawer.focus();
  }
  function closeDrawer(){
    drawer.classList.remove('on'); scrim.classList.remove('on');
    setBackgroundInert(false);
    if(lastTrigger && lastTrigger.focus) lastTrigger.focus();   /* 焦点归还触发元素 */
  }
  /* Tab 焦点锁定在抽屉内（首尾回环） */
  document.addEventListener('keydown',function(e){
    if(e.key!=='Tab' || !drawer.classList.contains('on')) return;
    var f=drawerFocusables(); if(!f.length) return;
    var first=f[0], last=f[f.length-1], act=document.activeElement;
    var inside=drawer.contains(act);
    if(e.shiftKey && (act===first || !inside)){ e.preventDefault(); last.focus(); }
    else if(!e.shiftKey && (act===last || !inside)){ e.preventDefault(); first.focus(); }
  });
  function secret(plain){
    lastTrigger=lastTrigger||document.activeElement;
    drawerTitle.textContent='一次性明文（只显示一次）';
    drawerBody.innerHTML='<div class="note bad"><b>这是你唯一一次看到明文的机会。</b>关闭后无法再查看，服务端只存 sha256；忘记请轮换。</div>'+
      '<div class="secret"><span class="mono">'+plain+'</span><button class="b" data-copy="'+plain.replace(/"/g,'&quot;')+'">复制</button></div>'+
      '<h4 style="margin:16px 0 6px">客户接入包</h4>'+
      '<div class="kv"><dt>base_url</dt><dd class="mono">https://api-relay.example.com/v1</dd><dt>指纹</dt><dd class="mono">'+Math.random().toString(16).slice(2,10)+'</dd></div>';
    drawerFoot.innerHTML='<button class="b pri" data-close>我已记录明文</button>';
    drawer.classList.add('on'); scrim.classList.add('on'); setBackgroundInert(true); drawer.focus();
    toast('已签发新 key（明文仅显示一次）','g');
  }
  document.getElementById('drawer-close').addEventListener('click',closeDrawer);
  scrim.addEventListener('click',closeDrawer);
  document.addEventListener('click',function(e){ if(e.target.closest('[data-close]')) closeDrawer(); });
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape'){ if(drawer.classList.contains('on')){ closeDrawer(); } else if(sidenav.classList.contains('on')){ sidenav.classList.remove('on'); navscrim.classList.remove('on'); } }
  });

  /* ---------- 初始化 ---------- */
  try{ var st=localStorage.getItem('proto_theme'); if(st) root.dataset.theme=st; }catch(_){}
  renderNav(); render(); fresh();

  /* 审批批量勾选计数 */
  document.addEventListener('change',function(e){
    if(e.target.id==='apv-all'){ var on=e.target.checked; document.querySelectorAll('.apv-ck:not(:disabled)').forEach(function(c){c.checked=on;}); }
    if(e.target.classList && e.target.classList.contains('apv-ck')){
      var n=document.querySelectorAll('.apv-ck:checked').length; var b=document.getElementById('batch-approve');
      if(b) b.textContent='批量批准（已选 '+n+'）';
    }
    /* P1-2：窗口/周期选择器 change 联动（对齐交互 I4） */
    if(e.target.id==='portal-win'||e.target.id==='ov-win'||e.target.id==='nf-win'){ toast('窗口已切到 '+e.target.value+'，图表/数字联动刷新（I4）','g'); fresh(); }
    if(e.target.id==='usage-period'){ toast('周期已切换：'+e.target.value+'，账单重拉（I4）','g'); }
    if(e.target.id==='nf-int'){ toast('刷新间隔已设为 '+e.target.value,'g'); }
    if(e.target.id==='cost-auto'){ toast('成本路由自动化：'+(e.target.checked?'已启用（缺失 cost 时给出 route_reason，不静默）':'已关闭，退化为纯优先级路由'), e.target.checked?'g':'y'); }
  });
  document.addEventListener('click',function(e){
    if(e.target.id==='batch-approve'){ var n=document.querySelectorAll('.apv-ck:checked').length;
      if(!n){ toast('请先勾选要批准的申请','y'); return; } toast('已批量批准 '+n+' 条，明文将各自一次性显示','g'); }
    /* P1-4：按旧顺序 / 新顺序切换 + 隐藏提示 */
    if(e.target.id==='toggle-nav-order'){
      navOldOrder=!navOldOrder;
      try{ localStorage.setItem('proto_nav_old', navOldOrder?'1':'0'); }catch(_){}
      renderNav();
      var tb=document.getElementById('toggle-nav-order'); if(tb) tb.textContent=navOldOrder?'按新顺序查看':'按旧顺序查看';
      toast('导航顺序：'+(navOldOrder?'旧顺序（监控/配置/智能/系统）':'新顺序（值守/经营/客户/系统）'),'g');
    }
    if(e.target.id==='dismiss-nav-note'){
      var nn=document.getElementById('nav-reorder-note'); if(nn) nn.style.display='none';
      try{ localStorage.setItem('proto_nav_note_dismissed','1'); }catch(_){}
      toast('已隐藏导航重排提示，可在「按旧顺序查看」处随时切换','g');
    }
  });

  // 品牌图标（内联 SVG，零依赖，替代 emoji）
  window.__protoReady=true;
})();
</script>
