# ⚠️ 本文件是【主配置源】，不直接被网关加载：api-relay 只吃单文件 --config。
#    模型链（modelLadders / modelCapabilities）见 config/relay-ladders.yaml。
#    改完任一源后执行：npm run config:build（生成 relay-net.yaml 与 config/relay.yaml 产物）。
#
# api-relay · OpenCSG 上游配置（2026-10-23 新增）
#
# 用途：把 OpenCSG AI Gateway 接入本站聚合平台，作为真实上游。
# 密钥一律走环境变量（{ENV:...}），不写明文 —— 本文件绑 0.0.0.0，明文 key 等于白送入口。
#
# 三把 OpenCSG key 配成三个 provider（opencsg-1/2/3）：
#   同名模型、同 priority、同 weight —— 网关按权重在三条线上做了负载均衡 + 故障转移，
#   等于把三把 key 的配额叠起来用。
#
# 2026-10-23 实测（/v1/models 返回 22 个 + 逐模型三把 key 探活）：
#   可用（14，三把 key 全 200）：见下方 models 列表。
#   不可用：convaiinnovations/laya、jev-1.13（400 不支持 chat）、
#           Qwen2-0.5B-Instruct:1mz（上游 502）。
#   非 chat 型号（guard/asr/rerank/embedding）不接。

server:
  host: "0.0.0.0"
  port: 8787
  adminToken: "{ENV:RELAY_ADMIN_TOKEN}"
  # ── 面板登录账号（2026-10-23 新增）────────────────────────────────
  # adminLogin：管理员账号，全权（配置/轮换/摘除/触发）。
  # viewerLogin：**只读账号**（评委查看用）—— 可登录、可看全部页面，
  #   任何写操作（POST/PUT/PATCH/DELETE）一律 403 readonly_account。
  # 两者均由 .relay.env 注入；密码未设置则 viewer 账号不启用。
  adminLogin:
    username: "{ENV:RELAY_ADMIN_USER:-admin}"
    password: "{ENV:RELAY_ADMIN_PASSWORD}"
  viewerLogin:
    username: "{ENV:RELAY_VIEWER_USER:-judge}"
    password: "{ENV:RELAY_VIEWER_PASSWORD}"
  trustProxy: false
  publicQuota: true
  publicQuotaRemote: false
  # ── 防上游探测（2026-10-23 新增）──────────────────────────────────
  # 对下游隐藏上游身份：/v1/models 的 owned_by 统一为 relay；响应头不再回显
  # x-relay-upstream / x-relay-model-served / x-relay-switched / x-relay-ladder；
  # x-relay-loss-reduction 去掉 provider=；归因 upstream 统一为 relay；
  # 响应体 model 字段强制回显请求模型名（不透传上游真实名，如 xxx-0731）。
  hideUpstream: true
  upstreamTtfbTimeoutMs: 90000
  upstreamTimeoutMs: 300000
  upstreamStallTimeoutMs: 20000
  streamCommitGraceMs: 8000
  streamHeartbeatMs: 5000
  hedgeDelayMs: 20000

storage:
  driver: sqlite
  path: data/relay.db

logLevel: info

# ── 分层策略（智能选项）──────────────────────────────────────────────
# deepMerge 深合并：只写要覆盖的字段，其余沿用内置默认（DEFAULT_TIERS）。
# smartRouting = 成本感知路由（"智能路由"）：简单任务自动挑最便宜可用上游。
#   默认值：free=false / standard=false / pro=true；此处三层全部显式开启。
#   生效条件：请求复杂度判定为 simple，且候选上游配有 cost（本配置三个上游均已配）。
# 注：面板「智能路由」列即读此字段（tiers.<层>.smartRouting）。
tiers:
  free:
    smartRouting: true
  standard:
    smartRouting: true
  pro:
    smartRouting: true

# ── 上游价格口径（2026-10-27 核）─────────────────────────────────────
# OpenCSG 官方未公开各模型的单点价目（其文档只说明"按目标服务配置的 SKU 核算"），
# 故此处按**各模型所属原厂**的公开定价设置，单位统一为**人民币元 / 百万 token**，
# 作为 cost（实付口径：成本统计 + 预算闸门 + smart routing 的依据）。三个 key 同价。
#   来源：DeepSeek 官方 api-docs（峰谷价，此处取高峰；空闲时段为其一半）；
#         阿里云百炼（华北2，qwen 取 0<Token≤256K 档）;
#         智谱 bigmodel（GLM-5.1 取 [0,32K) 档）；MiniMax 开放平台（M3 取五折现价）。
#   缺口：`auto`（OpenCSG 自动路由）与 `OpenCSG/Agentic-27B`（OpenCSG 自研）无公开价，
#         回落到厂商级 cost 兜底（1.0/2.0）；拿到 OpenCSG 实际结算价后按 modelCosts 覆盖。
providers:
  # ── OpenCSG 网关 #1 ────────────────────────────────────────────────
  - id: opencsg-1
    label: OpenCSG 网关 #1
    protocol: openai
    baseUrl: https://opencsg.com/aigateway/v1
    # 2026-10-31 三把 key 额度耗尽：先摘除凭据并停用上游，等新 key 到位后
    # 恢复为 "{ENV:OPENCSG_API_KEY_1}" 并删掉 disabled 行即可。
    apiKey: "pending-key-replacement"
    disabled: true
    models: [MiniMax-M2.5, OpenCSG/Agentic-27B, auto, deepseek-v4-flash, deepseek-v4-pro, deepseek-v4.1-flash-1017, glm-5.1, glm-5.2, glm-5.3-flash, minimax-m3, qwen3.6-plus, qwen3.7-plus, qwen3.8-flash, qwen3.8-max]
    weight: 1
    priority: 20
    tags: [cn, gateway, opencsg]
    cost: { inputPerMTok: 1.0, outputPerMTok: 2.0 }   # 厂商级兜底：auto / OpenCSG/Agentic-27B 无公开价时用它
    # 按型号实付价（各模型原厂公开定价，人民币元/百万 token）；未列出的型号回落到上面厂商级 cost。
    # 缓存命中价（cachedInputPerMTok）只填**官方直接列出具体单价**的模型（DeepSeek/GLM/MiniMax）；
    # qwen 系列官方按量页未给具体单价（仅比例，且 qwen3.8-max/flash 为例外），故不配 → 缺省按输入价计（保守）。
    modelCosts:
      'MiniMax-M2.5': { inputPerMTok: 2.1, outputPerMTok: 8.4, cachedInputPerMTok: 0.21 }
      'deepseek-v4-flash': { inputPerMTok: 3.0, outputPerMTok: 9.0, cachedInputPerMTok: 0.10 }
      'deepseek-v4-pro': { inputPerMTok: 9.0, outputPerMTok: 27.0, cachedInputPerMTok: 0.30 }
      'deepseek-v4.1-flash-1017': { inputPerMTok: 3.0, outputPerMTok: 9.0, cachedInputPerMTok: 0.10 }
      'glm-5.1': { inputPerMTok: 6, outputPerMTok: 24, cachedInputPerMTok: 1.3 }
      'glm-5.2': { inputPerMTok: 8, outputPerMTok: 28, cachedInputPerMTok: 2 }
      'glm-5.3-flash': { inputPerMTok: 0.8, outputPerMTok: 2.8, cachedInputPerMTok: 0.23 }
      'minimax-m3': { inputPerMTok: 2.1, outputPerMTok: 8.4, cachedInputPerMTok: 0.42 }
      'qwen3.6-plus': { inputPerMTok: 2, outputPerMTok: 12 }
      'qwen3.7-plus': { inputPerMTok: 1.6, outputPerMTok: 6.4 }
      'qwen3.8-flash': { inputPerMTok: 0.8, outputPerMTok: 2.7 }
      'qwen3.8-max': { inputPerMTok: 12, outputPerMTok: 36 }
    # 按型号刊例价（官方牌面价；仅 minimax-m3 / qwen3.7-plus 与实付有差异，其余与实付同价）
    modelListCosts:
      'MiniMax-M2.5': { inputPerMTok: 2.1, outputPerMTok: 8.4, cachedInputPerMTok: 0.21 }
      'deepseek-v4-flash': { inputPerMTok: 3.0, outputPerMTok: 9.0, cachedInputPerMTok: 0.10 }
