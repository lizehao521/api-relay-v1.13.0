    weight: 1
    priority: 20
    tags: [cn, gateway, intern-ai]

# ── 模型别名（2026-10-23 扩充）──────────────────────────────────────
# 原因：下游常用第三方客户端，其**默认模型名**是 gpt-4o / claude-3-5-sonnet / gemini-*
# 这类业界通用名。网关对未声明的名字返回 404 model_not_found（"没有任何上游声明支持模型…"），
# 于是用户看到"获取不到模型"。把常见名映射到本网关已开通的模型，客户端开箱可用。
# 注意：别名必须指向**已在本网关开通**的模型（否则仍会 404）。
# 2026-11-01：OpenCSG 停用后别名原指向 OpenCSG 专属型号（qwen3.8-max 等），
# 客户端用标准名会 503；现统一改指向 intern-ai 渠道的在服务模型。
modelAliases:
  # —— OpenAI 系 ——
  gpt-4o: qwen3.8-27b
  gpt-4o-mini: deepseek-v4-flash-0731
  gpt-4-turbo: deepseek-v4-pro-0813
  gpt-4: deepseek-v4-pro-0813
  gpt-3.5-turbo: deepseek-v4-flash-0731
  gpt-35-turbo: deepseek-v4-flash-0731
  o1: kimi-k2.6
  o1-mini: deepseek-v4-flash-0731
  o3-mini: glm-5.3
  # —— Anthropic 系 ——
  claude-3-5-sonnet-20241022: glm-5.3
  claude-3-5-sonnet: glm-5.3
  claude-3-opus: deepseek-v4-pro-0813
  claude-3-haiku: deepseek-v4-flash-0731
  # —— Google 系 ——
  gemini-1.5-pro: qwen3.8-27b
  gemini-1.5-flash: deepseek-v4-flash-0731
  gemsi-flash: deepseek-v4-flash-0731
  # —— DeepSeek 系 ——
  deepseek-chat: deepseek-v4.1-flash-1017
  deepseek-reasoner: deepseek-v4-pro-0813
  # —— 兜底 ——
  default: deepseek-v4-flash-0731

defaultProvider: intern-ai

clients:
  - id: free
    label: 免费层（纯转发）
    key: "{ENV:RELAY_KEY_FREE}"
    tier: free
    tenantId: demo
    enabled: true
  - id: standard
    label: 标准层（归因走响应头）
    key: "{ENV:RELAY_KEY_STANDARD}"
    tier: standard
    tenantId: demo
    enabled: true
  - id: pro
    label: Pro 层（预检+归因全开）
    key: "{ENV:RELAY_KEY_PRO}"
    tier: pro
    tenantId: demo
    enabled: true
  # ── 内部 Agent 专用 key（2026-10-23 新增）──────────────────────────
  # Agent 调 LLM 走**本网关自身** /v1/chat/completions（自证闭环）：
  # 该 key 走完整鉴权/预检/路由/归因/计量链路，Agent 产生的 token 用量
  # 自然落到 meter（按 agent 指纹可识别），不绕开自己的网关。
  - id: agent
    label: 内部运维 Agent（自托管 LLM 闭环）
    key: "{ENV:RELAY_KEY_AGENT}"
    tier: pro
    tenantId: agent
    enabled: true

# ── 知识库（垂直 Agent 能力；启用后 Agent 的迭代建议可沉淀）──────────
# 独立 SQLite 库，与主度量库分离。缺省 / path 为空 = 未启用。
kb:
  path: "data/kb.db"
  chunkSize: 512
  chunkOverlap: 64

# ── 内部 Agent 系统（自托管运维/迭代决策环，2026-10-23 新增）──────────
# 闭环：读取运营快照 → 调用本网关自身 LLM 分析 → 产出运维/迭代建议
#       → 沉淀到知识库 → 审计事件落库（store.logEvent）。
# 带 toolCtx 工具循环（get_metrics / list_events / list_providers /
# get_trace / search_kb / get_catalog / read_policy 等，只读取证）。
agent:
  enabled: true
  # 用 clients 里声明的 agent 专用 key 调 LLM（pro 层：预检/归因/计量全开）
  clientId: agent
  # 模型须在本网关已开通清单内（走 /v1/chat/completions，自证闭环）
  model: "deepseek-v4-flash"
  # 周期巡检：30 分钟一轮；0 = 只手动触发
  intervalMs: 1800000
  # 单轮 LLM 超时
  llmTimeoutMs: 60000
  # 巡检产出的迭代建议直接沉淀到 KB（也可在面板人工确认后写入）
  autoWriteKb: true
  # 单轮喂给 LLM 的最近事件数（细节留给工具按需取证）
  recentEvents: 30
  # 知识沉淀目标 KB（须先创建；不存在则跳过回写且不报错）
  kbId: "relay-ops"
  # Agent 自身日护栏：任一超限拒绝下一轮并记 agent.quota_blocked 事件
  dailyTokenLimit: 200000
  dailyCostCnyLimit: 5
  # ── 决策矩阵（决策仲裁，2026-10-29 新增）────────────────────────────────
  # 六维加权打分（每维 0..1，risk/effort 是"越高越有利"的反向分）：impact 影响面 0.30 /
  # confidence 置信度 0.25 / evidence 证据 0.15 / risk 安全性 0.20 / effort 可执行性 0.05 /
  # novelty 新颖度 0.05；score = Σ(权重×维度)，按 accept/queue/reject 三档归档。
  # 四门 G1 复用 / G2 增量 / G3 收益 / G4 回归：任一门不通过即**强制降档**
  # （accept→queue→reject），rawTier 保留原档以便复盘。
  # 安全不变量：矩阵只仲裁不扩权——只下压档位、不改动作内容；reject 档剥离 proposedChange，
  # 被驳回的建议不会流向任何执行路径。enabled: false = 完全不介入（零行为变化）。
  decisionMatrix:
    enabled: true
    acceptThreshold: 0.70
    queueThreshold: 0.45
    historyLimit: 50
    adaptiveNovelty: true

lossReduction:
  precheck:
    enabled: true
    onBlock: reject
    budgetUs: 3000
  attribution:
    enabled: true
    includeEvidence: false
    autoRetry: 1
    backoffBaseMs: 400
    backoffMaxMs: 8000
  meter:
    enabled: true
    retentionDays: 30
  trace:
    enabled: true
    ringSize: 500
    persist: true

# ============================================================
# 以下 modelLadders / modelCapabilities 由
#   config/relay-ladders.yaml
# 合并而来（本文件是【产物】，请勿直接编辑）。
# 改源文件后执行：npm run config:build
# ============================================================

# api-relay 模型链源文件（档位阶梯 + 能力表）· 2026-10-28 改中文链名
#
# 本文件是**源**，不直接被网关加载：api-relay 只吃单文件（--config <path>）。
# 通过 `npm run config:build` 与 config/relay.base.yaml（主配置）文本合并，
# 生成 relay-net.yaml 与 config/relay.yaml 两份等价产物后才真正生效。
# 请勿直接编辑产物文件——改这里，再重新构建。
#
# 上游：OpenCSG 网关（opencsg-1/2/3 三把 key），14 个可用模型。
# 价格口径见 config/relay.base.yaml 的 providers[].modelCosts（元/百万 token）。

# ── 模型能力表（切模型前的安全前提）────────────────────────────────────
# 带 tools 的请求只会被切到 tools: true 的模型；未声明的字段视为「未知，允许」。
# contextWindow 未实测，故不声明（本项目纪律：没实测过的数据不编）。
modelCapabilities:
  'qwen3.8-max': { tools: true }
  'glm-5.2': { tools: true }
  'deepseek-v4-pro': { tools: true }
  'deepseek-v4.1-flash-1017': { tools: true }
  'glm-5.1': { tools: true }
  'qwen3.7-plus': { tools: true }
  'qwen3.8-flash': { tools: true }
  'glm-5.3-flash': { tools: true }
  'qwen3.6-plus': { tools: true }
  'deepseek-v4-flash': { tools: true }
  # intern-ai 渠道（2026-10-31 接入）：以下模型在 /v1/models 里均声明支持 tools 与流式。
  'glm-5.3': { tools: true }
  'deepseek-v4-pro-0813': { tools: true }
  'deepseek-v4-flash-0731': { tools: true }
  'kimi-k2.6': { tools: true }
  'minimax-m3': { tools: true }
  # 未声明的（auto / OpenCSG/Agentic-27B / MiniMax-M2.5 / minimax-m3）视为「未知，允许」；
  # 其中 auto 与 OpenCSG/Agentic-27B 本就无公开价，也不放进任何阶梯。

# ── 档位阶梯（竖向链）──────────────────────────────────────────────────
# 第一阶是首选，失败就试第二阶；方向完全由这张表决定，不是写死的单向降级。
#   旗舰：旗舰挂了 → 往下推（平衡 → 极速），保证任务跑完
#   极速：极速挂了 → 往上推（平衡 → 旗舰）
# 目的不是省钱，是**让客户的任务自动跑完**；实际服务模型见面板「运维」页的
# 「模型别名」行（渲染为 名 → 模型 → 模型 → 模型），或用 `relay trace <traceId>` 回放。
#
# ⚠️ 链名即客户端请求的 model 名（如 "旗舰"）。改中文名后，客户端请求要用中文，
#    否则会 404 model_not_found；本配置的 clients 未设 allowedModels 白名单，无需同步。
# ⚠️ 跨厂商兜底必须另起名字（如 旗舰-any），否则「往下推一档」会偷偷变成「换一家厂」。
#    当前三个 provider（opencsg-1/2/3）baseUrl 相同、只是三把 key，属**同厂商**横向均衡，
#    故此处不写 *-any 阶梯；接入第二家真实厂商后再补。
modelLadders:
  旗舰:  [qwen3.8-max, glm-5.2, deepseek-v4-pro, qwen3.7-plus, glm-5.3, deepseek-v4-pro-0813]
  平衡:  [deepseek-v4.1-flash-1017, qwen3.7-plus, deepseek-v4-flash, qwen3.8-flash, kimi-k2.6, glm-5.3]
  极速:  [qwen3.8-flash, glm-5.3-flash, deepseek-v4-flash, qwen3.6-plus, deepseek-v4-flash-0731, minimax-m3]
  推理:  [deepseek-v4-pro, deepseek-v4.1-flash-1017, deepseek-v4-pro-0813, glm-5.3]
  # ── 跨厂商兜底链（2026-10-31 接入 intern-ai 后按本文件顶部纪律补）──
  # 前段与同厂商链一致，末尾才进入 intern-ai；需要"允许换一家厂"时用这些名字。
  旗舰-any:  [qwen3.8-max, glm-5.2, deepseek-v4-pro, qwen3.7-plus, glm-5.3, deepseek-v4-pro-0813]
  平衡-any:  [deepseek-v4.1-flash-1017, qwen3.7-plus, deepseek-v4-flash, qwen3.8-flash, kimi-k2.6, glm-5.3]
  极速-any:  [qwen3.8-flash, glm-5.3-flash, deepseek-v4-flash, qwen3.6-plus, deepseek-v4-flash-0731, minimax-m3]
  推理-any:  [deepseek-v4-pro, deepseek-v4.1-flash-1017, deepseek-v4-pro-0813, glm-5.3]