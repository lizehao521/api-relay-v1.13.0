      'glm-5.1': { inputPerMTok: 6, outputPerMTok: 24, cachedInputPerMTok: 1.3 }
      'glm-5.2': { inputPerMTok: 8, outputPerMTok: 28, cachedInputPerMTok: 2 }
      'glm-5.3-flash': { inputPerMTok: 0.8, outputPerMTok: 2.8, cachedInputPerMTok: 0.23 }
      'minimax-m3': { inputPerMTok: 4.2, outputPerMTok: 16.8, cachedInputPerMTok: 0.84 }
      'qwen3.6-plus': { inputPerMTok: 2, outputPerMTok: 12 }
      'qwen3.7-plus': { inputPerMTok: 2, outputPerMTok: 8 }
      'qwen3.8-flash': { inputPerMTok: 0.8, outputPerMTok: 2.7 }
      'qwen3.8-max': { inputPerMTok: 12, outputPerMTok: 36 }

