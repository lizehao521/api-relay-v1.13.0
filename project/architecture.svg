<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 900" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',system-ui,sans-serif">
  <defs>
    <marker id="arr-b" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arr-g" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#059669"/>
    </marker>
    <marker id="arr-o" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/>
    </marker>
    <marker id="arr-p" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7c3aed"/>
    </marker>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <style>
    .t-title { font-size: 17px; font-weight: 700; fill: #0f1117; }
    .t-layer { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; fill: #8b949e; text-transform: uppercase; }
    .t-node  { font-size: 13px; font-weight: 600; fill: #1f2937; }
    .t-sub   { font-size: 11px; fill: #6b7280; }
    .t-flow  { font-size: 12px; font-weight: 600; }
    .t-small { font-size: 11px; fill: #4b5563; }
    .t-step  { font-size: 11px; fill: #374151; font-family: ui-monospace, Consolas, monospace; }
  </style>

  <!-- 背景 -->
  <rect x="0" y="0" width="1160" height="900" fill="#f8f9fa"/>
  <text x="48" y="42" class="t-title">api-relay 系统架构 · OpenAI 兼容多上游聚合网关（内嵌降损层）</text>
  <text x="48" y="62" class="t-sub">数据面（转发）零依赖 node:http · 控制面（看板/持久化）故障自动降级 · 成功响应逐字节透传</text>

  <!-- ============ L1 客户端层 ============ -->
  <text x="48" y="100" class="t-layer">客户端 CLIENTS</text>
  <g filter="url(#soft)">
    <rect x="48" y="112" width="200" height="58" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
    <text x="148" y="136" text-anchor="middle" class="t-node">openai SDK 客户端</text>
    <text x="148" y="154" text-anchor="middle" class="t-sub">chat/completions · 流式 SSE</text>

    <rect x="276" y="112" width="200" height="58" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
    <text x="376" y="136" text-anchor="middle" class="t-node">Agent / 脚本</text>
    <text x="376" y="154" text-anchor="middle" class="t-sub">错误驱动的可执行动作</text>

    <rect x="504" y="112" width="200" height="58" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
    <text x="604" y="136" text-anchor="middle" class="t-node">浏览器</text>
    <text x="604" y="154" text-anchor="middle" class="t-sub">管理面板 /admin</text>
  </g>

  <!-- ============ L2 传输层 RelayServer ============ -->
  <text x="48" y="206" class="t-layer">传输层 TRANSPORT — gateway/server.ts</text>
  <g filter="url(#soft)">
    <rect x="48" y="218" width="656" height="74" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/>
    <text x="376" y="243" text-anchor="middle" class="t-node">RelayServer（node:http，零运行时依赖）</text>
    <text x="376" y="262" text-anchor="middle" class="t-sub">解析 HTTP · 注入 x-request-id · 限体积 · SSE 逐字节转发 + 字节计数</text>
    <text x="376" y="278" text-anchor="middle" class="t-sub">↑ 与 Engine 以 EngineRequest/EngineResult 解耦（换传输只改此层）</text>
  </g>
  <g filter="url(#soft)">
    <rect x="744" y="218" width="368" height="74" rx="10" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.2"/>
    <text x="928" y="243" text-anchor="middle" class="t-node">AdminServer（同进程 · /admin/api/*）</text>
    <text x="928" y="262" text-anchor="middle" class="t-sub">管理 JSON API + authorize() 鉴权 + 写操作 logEvent() 留痕</text>
    <text x="928" y="278" text-anchor="middle" class="t-sub">服务 dist-admin 静态面板（gzip 预压缩 + immutable 缓存）</text>
  </g>

  <!-- ============ L3 引擎管道 Engine ============ -->
  <text x="48" y="330" class="t-layer">引擎管道 ENGINE — gateway/engine.ts（与 HTTP 无关，可单测直接驱动）</text>
  <g filter="url(#soft)">
    <rect x="48" y="342" width="1064" height="120" rx="12" fill="#ffffff" stroke="#c4cdd6" stroke-width="1.4"/>
    <!-- 10 步管道 -->
    <text x="72" y="368" class="t-small">一次调用的完整记账：</text>
    <g font-family="ui-monospace, Consolas, monospace" font-size="11">
      <rect x="72" y="380" width="88" height="26" rx="6" fill="#f3f4f6" stroke="#d1d5db"/><text x="116" y="397" text-anchor="middle" fill="#374151">① parse</text>
      <rect x="168" y="380" width="88" height="26" rx="6" fill="#fef2f2" stroke="#fca5a5"/><text x="212" y="397" text-anchor="middle" fill="#991b1b">② auth</text>
      <rect x="264" y="380" width="104" height="26" rx="6" fill="#fff7ed" stroke="#fdba74"/><text x="316" y="397" text-anchor="middle" fill="#9a3412">③ precheck P2</text>
      <rect x="376" y="380" width="96" height="26" rx="6" fill="#f3f4f6" stroke="#d1d5db"/><text x="424" y="397" text-anchor="middle" fill="#374151">④ fingerprint</text>
      <rect x="488" y="380" width="104" height="26" rx="6" fill="#f3f4f6" stroke="#d1d5db"/><text x="540" y="397" text-anchor="middle" fill="#374151">⑤ complexity</text>
      <rect x="604" y="380" width="80" height="26" rx="6" fill="#eff6ff" stroke="#93c5fd"/><text x="644" y="397" text-anchor="middle" fill="#1d4ed8">⑥ route</text>
      <rect x="692" y="380" width="96" height="26" rx="6" fill="#eff6ff" stroke="#93c5fd"/><text x="740" y="397" text-anchor="middle" fill="#1d4ed8">⑦ upstream</text>
      <rect x="798" y="380" width="100" height="26" rx="6" fill="#f0fdf4" stroke="#86efac"/><text x="848" y="397" text-anchor="middle" fill="#166534">⑧ classify P3</text>
      <rect x="910" y="380" width="88" height="26" rx="6" fill="#f0fdf4" stroke="#86efac"/><text x="954" y="397" text-anchor="middle" fill="#166534">⑨ meter P8</text>
      <rect x="1010" y="380" width="82" height="26" rx="6" fill="#f3f4f6" stroke="#d1d5db"/><text x="1051" y="397" text-anchor="middle" fill="#374151">⑩ respond</text>
    </g>
    <text x="72" y="432" class="t-sub">⑥→⑧ 失败循环：classify 归因 → 可恢复则退避重试（致命归因进 fatal，瞬态进 tried · 最多 1+autoRetry 次）</text>
    <text x="72" y="450" class="t-sub">流式路径：上游 fetch tee 双分支 —— 客户端分支零拷贝（别名才逐帧改 model），度量分支旁路解析不 backpressure</text>
  </g>

  <!-- ============ L4 协作模块层 ============ -->
  <text x="48" y="502" class="t-layer">协作模块 COLLABORATORS — loss/ 2,133 行 · gateway/ · upstream/ 1,265 行</text>
  <g filter="url(#soft)">
    <rect x="48" y="514" width="248" height="96" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.2"/>
    <text x="172" y="538" text-anchor="middle" class="t-node">KeyRegistry</text>
    <text x="172" y="556" text-anchor="middle" class="t-sub">鉴权 / 限流 / 并发额度</text>
    <text x="172" y="572" text-anchor="middle" class="t-sub">唯一 fail-CLOSED 安全边界</text>
    <text x="172" y="588" text-anchor="middle" class="t-sub">key 只存 sha256 索引</text>

    <rect x="324" y="514" width="248" height="96" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/>
    <text x="448" y="538" text-anchor="middle" class="t-node">ProviderPool + Router</text>
    <text x="448" y="556" text-anchor="middle" class="t-sub">上游池：健康 / 熔断 / 并发闸门</text>
    <text x="448" y="572" text-anchor="middle" class="t-sub">排序：未试过 &gt; tried &gt; 刚失败</text>
    <text x="448" y="588" text-anchor="middle" class="t-sub">再按 priority / cost / ewma</text>

    <rect x="600" y="514" width="248" height="96" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
    <text x="724" y="538" text-anchor="middle" class="t-node">Classifier（P3 归因）</text>
    <text x="724" y="556" text-anchor="middle" class="t-sub">纯函数规则库 · 带 confidence</text>
    <text x="724" y="572" text-anchor="middle" class="t-sub">错误 → Agent 可执行动作</text>
    <text x="724" y="588" text-anchor="middle" class="t-sub">高置信结果 LRU 记忆化</text>

    <rect x="876" y="514" width="236" height="96" rx="10" fill="#faf5ff" stroke="#c4b5fd" stroke-width="1.2"/>
    <text x="994" y="538" text-anchor="middle" class="t-node">Meter / Tracer（P8/P5）</text>
    <text x="994" y="556" text-anchor="middle" class="t-sub">内存入队绝不阻塞主路径</text>
    <text x="994" y="572" text-anchor="middle" class="t-sub">fail-open · 后台批量 flush</text>
    <text x="994" y="588" text-anchor="middle" class="t-sub">轨迹 ≤64 步 / 摘要 ≤240 字符</text>
  </g>

  <!-- ============ L5 上游客户端 + 存储 + 上游厂商 ============ -->
  <text x="48" y="646" class="t-layer">上游客户端 UPSTREAM CLIENT — upstream/client.ts</text>
  <g filter="url(#soft)">
    <rect x="48" y="658" width="392" height="86" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/>
    <text x="244" y="682" text-anchor="middle" class="t-node">UpstreamClient（OpenAI 兼容）</text>
    <text x="244" y="700" text-anchor="middle" class="t-sub">多 key 轮换 KeyRotator：round-robin · 瞬态短冷却 · 永久报废</text>
    <text x="244" y="716" text-anchor="middle" class="t-sub">auth 格式适配：bearer / bearerless / api-key-header / x-api-key</text>
    <text x="244" y="732" text-anchor="middle" class="t-sub">契约冻结 UpstreamOutcome —— 新协议（Anthropic/Gemini）加实现即接</text>
  </g>

  <text x="468" y="646" class="t-layer">存储 STORE — store/ 923 行</text>
  <g filter="url(#soft)">
    <!-- 圆柱体：顶面椭圆 + 侧壁（简洁写法，无多余突起） -->
    <path d="M 480 668 A 182 10 0 0 1 844 668 L 844 734 A 182 10 0 0 1 480 734 Z" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
    <ellipse cx="662" cy="668" rx="182" ry="10" fill="#f3f4f6" stroke="#d0d7de" stroke-width="1.2"/>
    <text x="662" y="694" text-anchor="middle" class="t-node">Store：SQLite（WAL）⇄ 内存 双实现</text>
    <text x="662" y="712" text-anchor="middle" class="t-sub">meter / trace / breaker_state / key_meta · 保留期 retentionDays</text>
    <text x="662" y="728" text-anchor="middle" class="t-sub">DB 故障 → 自动降级纯内存 + degradedEvents（转发不受影响）</text>
  </g>

  <text x="884" y="646" class="t-layer">上游厂商 PROVIDERS</text>
  <g filter="url(#soft)">
    <rect x="884" y="658" width="228" height="86" rx="10" fill="#f8fafc" stroke="#c4cdd6" stroke-width="1.2" stroke-dasharray="6 3"/>
    <text x="998" y="682" text-anchor="middle" class="t-node">DeepSeek / 百炼 / 硅基流动</text>
    <text x="998" y="700" text-anchor="middle" class="t-sub">Moonshot / 智谱 / Ark / OpenRouter</text>
    <text x="998" y="716" text-anchor="middle" class="t-sub">vLLM 自建 / Agnes / mock（测试）</text>
    <text x="998" y="732" text-anchor="middle" class="t-sub">档位阶梯：旗舰/平衡/极速 自动降级</text>
  </g>

  <!-- ============ 箭头：L1→L2 ============ -->
  <line x1="148" y1="170" x2="300" y2="214" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-b)"/>
  <text x="200" y="184" class="t-flow" fill="#2563eb">POST /v1/chat/completions</text>
  <line x1="376" y1="170" x2="400" y2="214" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-b)"/>
  <line x1="604" y1="170" x2="928" y2="214" stroke="#ea580c" stroke-width="1.5" marker-end="url(#arr-o)"/>
  <text x="700" y="199" class="t-flow" fill="#ea580c">管理面板 HTTP</text>

  <!-- L2→L3 -->
  <line x1="376" y1="292" x2="376" y2="338" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-b)"/>
  <text x="388" y="320" class="t-flow" fill="#2563eb">EngineRequest（已解耦传输）</text>
  <line x1="928" y1="292" x2="928" y2="338" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="4 2" marker-end="url(#arr-o)"/>
  <text x="940" y="320" class="t-flow" fill="#ea580c">读写 overview / keys / config</text>

  <!-- L3→L4 四条协作线 -->
  <line x1="180" y1="462" x2="172" y2="510" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-b)"/>
  <text x="76" y="492" class="t-step">②authenticate</text>
  <line x1="470" y1="462" x2="448" y2="510" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-b)"/>
  <text x="424" y="492" class="t-step">⑥route</text>
  <line x1="800" y1="462" x2="724" y2="510" stroke="#059669" stroke-width="2" marker-end="url(#arr-g)"/>
  <text x="706" y="492" class="t-step">⑧classify</text>
  <line x1="1000" y1="462" x2="994" y2="510" stroke="#7c3aed" stroke-width="2" marker-end="url(#arr-p)"/>
  <text x="1010" y="492" class="t-step">⑨record</text>

  <!-- L4→L5 -->
  <line x1="448" y1="610" x2="280" y2="654" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-b)"/>
  <text x="304" y="632" class="t-step">send（候选上游）</text>
  <line x1="994" y1="610" x2="700" y2="654" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arr-p)"/>
  <text x="782" y="632" class="t-step">异步批量落库</text>
  <line x1="576" y1="610" x2="576" y2="654" stroke="#059669" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arr-g)"/>
  <text x="470" y="636" class="t-step">熔断状态持久化</text>

  <!-- UpstreamClient→厂商：经 Store 下方走廊 y=764 绕行（不穿圆柱体） -->
  <path d="M 380 744 L 380 764 L 958 764 L 958 746" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arr-b)"/>
  <text x="560" y="758" class="t-flow" fill="#2563eb">HTTPS · OpenAI 兼容 /chat/completions · SSE 流式回传</text>

  <!-- Store→AdminServer 控制面回读（沿最右侧 x=1148 走线，绕开全部内容） -->
  <path d="M 844 715 C 1000 715, 1148 640, 1148 480 C 1148 400, 1148 300, 1148 292 L 1116 292" fill="none" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="4 2" marker-end="url(#arr-o)"/>
  <text x="1140" y="480" class="t-flow" fill="#ea580c" transform="rotate(-90 1140 480)" text-anchor="middle">聚合查询 → 看板 15s 自动刷新</text>

  <!-- ============ 图例 ============ -->
  <g>
    <rect x="48" y="784" width="1064" height="92" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
    <text x="68" y="810" font-size="12" font-weight="700" fill="#374151">图例</text>
    <line x1="68" y1="826" x2="108" y2="826" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-b)"/>
    <text x="114" y="830" class="t-small">主数据流 / 转发路径（成功响应逐字节透传）</text>
    <line x1="68" y1="850" x2="108" y2="850" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="4 2" marker-end="url(#arr-o)"/>
    <text x="114" y="854" class="t-small">控制流（管理面板 · 只读为主 + 运营动作）</text>
    <line x1="560" y1="826" x2="600" y2="826" stroke="#059669" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arr-g)"/>
    <text x="606" y="830" class="t-small">状态持久化（熔断/额度，fail-safe）</text>
    <line x1="560" y1="850" x2="600" y2="850" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arr-p)"/>
    <text x="606" y="854" class="t-small">度量/轨迹异步写入（内存队列，fail-open）</text>
    <text x="68" y="872" class="t-small" fill="#9ca3af">源码规模：loss/ 2,133 行 · gateway/ 1,889 行 · upstream/ 1,265 行 · store/ 923 行 · 零运行时依赖 · 297 项单测 + 30 项 e2e</text>
  </g>
</svg>
